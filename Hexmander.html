<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexmander</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            max-width: 100%;
        }

        .header {
            height: 50px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto;
            overflow: visible;
        }

        .status-left {
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: absolute;
            left: 0;
            z-index: 1;
            padding-right: 0.5em;
        }

        .status-center {
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            white-space: nowrap;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        .controls-right {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: absolute;
            right: 0;
            z-index: 1;
            gap: 0.5em;
        }

        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #f0f0f0;
        }

        .footer {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board {
            background-color: #d9a359;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #last-move-text {
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            white-space: nowrap;
        }

        #copy-move {
            font-size: 1.2em;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-icon {
            width: 1em;
            height: 1em;
            vertical-align: middle;
        }

        #copy-move:hover .copy-icon path {
            fill: #555;
        }

        .grid {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .lines {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .replay-controls {
            display: flex;
            flex-wrap: nowrap;
            width: 100%;
            gap: 0.5em;
            overflow: hidden;
            justify-content: center;
        }

        .replay-controls button,
        .replay-controls select {
            flex: 0 1 auto;
            padding: 0.3em 0.5em;
            font-size: 1em;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            transition: background 0.3s ease;
            min-width: 0;
            text-overflow: clip;
            overflow: hidden;
            white-space: nowrap;
            max-width: 100px;
        }

        button, select {
            font-size: 1em;
            padding: 0.3em 0.5em;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:not(:disabled):hover, select:hover {
            background: #FFF5E9;
        }

        select {
            cursor: pointer;
            text-align: center;
        }

        .replay-controls button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .piece-icon {
            width: 1em;
            height: 1em;
            vertical-align: middle;
            margin-right: 0.5em;
        }

        #message {
            font-family: Arial, sans-serif;
            position: absolute;
            left: calc(50vw + 50vh - 30px);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            color: #d32f2f;
            width: 20vw;
            text-align: left;
        }

        .left-spacing {
            margin-left: 0.5em;
        }

        #random-button {
            flex: 0 1 auto;
            min-width: 0;
            text-align: center;
            max-width: 8em;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="status-left" id="turn-status"></div>
        <div class="status-center" id="score-status"></div>
        <div class="controls-right">
            <div id="last-move-display" style="display: flex; align-items: center; gap: 0.5em;">
                <span id="last-move-text"></span>
                <button id="copy-move" title="Copy last move" style="display: none;">
                    <svg class="copy-icon" viewBox="0 0 23 24">
                        <path fill="black" d="M19 21H8V7h11m0-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-3-4H4a2 2 0 0 0-2 2v14h2V3h12V1z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div class="board-container">
        <div class="board" id="board">
            <div class="lines" id="lines"></div>
            <div class="grid" id="grid"></div>
        </div>
        <div id="message"></div>
    </div>
    <div class="footer">
        <div class="replay-controls">
            <button onmousedown="replayStart()"><<</button>
            <button onmousedown="replayBack()"><</button>
            <button onmousedown="replayForward()">></button>
            <button onmousedown="replayEnd()">>></button>
            <button id="random-button" onmousedown="generateRandomGame()">Random game</button>
            <select id="save-options" onchange="handleSave()">
                <option value="" disabled selected hidden>Save</option>
                <option value="file">To file</option>
                <option value="clipboard">To clipboard</option>
            </select>
            <select id="load-options" onchange="handleLoad()">
                <option value="" disabled selected hidden>Load</option>
                <option value="file">From file</option>
                <option value="clipboard">From clipboard</option>
            </select>
            <select id="board-size" onchange="changeBoardSize()">
                <option value="3">Size 3</option>
                <option value="4">Size 4</option>
                <option value="5" selected>Size 5</option>
                <option value="6">Size 6</option>
                <option value="7">Size 7</option>
                <option value="8">Size 8</option>
                <option value="9">Size 9</option>
                <option value="10">Size 10</option>
            </select>
            <input type="file" id="load-input" style="display: none;" accept=".txt" onchange="loadGame(event)">
        </div>
    </div>
</div>

<script>
    // =====================================================================
    //  GLOBAL STATE
    // =====================================================================
    let SIZE = 5;
    let hexBoard = new Map(); // key: "q,r", value: {color, shape} | null
    let turn = 'black';
    let lastMoveQ = null;
    let lastMoveR = null;
    let lastShape = null;
    let gameHistory = [];
    let currentMoveIndex = 0;
    let isGenerating = false;
    let generationInterval = null;
    let gameOver = false;

    const SQRT3 = Math.sqrt(3);
    const HEX_DIRS = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];

    const blackPieceSVG = `<svg class="piece-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="black"/></svg>`;
    const whitePieceSVG = `<svg class="piece-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="white" stroke="black" stroke-width="5"/></svg>`;

    // =====================================================================
    //  HEX GRID UTILITIES
    // =====================================================================

    function getAllCells(n) {
        const cells = [];
        for (let q = -(n-1); q <= n-1; q++) {
            for (let r = -(n-1); r <= n-1; r++) {
                if (Math.abs(q + r) <= n-1) cells.push([q, r]);
            }
        }
        return cells;
    }

    function getHexNeighbors(q, r, n) {
        const neighbors = [];
        for (const [dq, dr] of HEX_DIRS) {
            const nq = q + dq, nr = r + dr;
            if (Math.abs(nq) <= n-1 && Math.abs(nr) <= n-1 && Math.abs(nq+nr) <= n-1) {
                neighbors.push([nq, nr]);
            }
        }
        return neighbors;
    }

    function hexToPixel(q, r, s) {
        return [s * SQRT3 * (q + r / 2), s * 1.5 * r];
    }

    function hexPointsString(cx, cy, s) {
        const pts = [];
        for (let i = 0; i < 6; i++) {
            const angle = Math.PI / 3 * i - Math.PI / 6;
            pts.push((cx + s * Math.cos(angle)).toFixed(3) + ',' + (cy + s * Math.sin(angle)).toFixed(3));
        }
        return pts.join(' ');
    }

    function onBoard(q, r, n) {
        return Math.abs(q) <= n-1 && Math.abs(r) <= n-1 && Math.abs(q+r) <= n-1;
    }

    function initHexBoard(n) {
        hexBoard = new Map();
        for (const [q, r] of getAllCells(n)) hexBoard.set(`${q},${r}`, null);
    }

    function getBoardDimensions(n) {
        const ratio = SQRT3 * (2*n - 1) / (3*n - 1);
        const maxH = window.innerHeight - 100;
        const maxW = window.innerWidth;
        let h = maxH, w = h * ratio;
        if (w > maxW) { w = maxW; h = w / ratio; }
        return { w, h };
    }

    // =====================================================================
    //  HEXMANDER GAME LOGIC
    // =====================================================================

    // Get the same-shape connected clump containing (q, r)
    function getClump(q, r) {
        const key = `${q},${r}`;
        const cell = hexBoard.get(key);
        if (!cell) return [];
        const shape = cell.shape;
        const visited = new Set([key]);
        const clump = [];
        const queue = [[q, r]];
        while (queue.length > 0) {
            const [cq, cr] = queue.shift();
            clump.push([cq, cr]);
            for (const [nq, nr] of getHexNeighbors(cq, cr, SIZE)) {
                const nkey = `${nq},${nr}`;
                if (!visited.has(nkey)) {
                    const nc = hexBoard.get(nkey);
                    if (nc && nc.shape === shape) {
                        visited.add(nkey);
                        queue.push([nq, nr]);
                    }
                }
            }
        }
        return clump;
    }

    // Get all same-shape connected clumps on the board
    function getAllClumps() {
        const visited = new Set();
        const clumps = [];
        for (const [q, r] of getAllCells(SIZE)) {
            const key = `${q},${r}`;
            const cell = hexBoard.get(key);
            if (cell && !visited.has(key)) {
                const clump = getClump(q, r);
                for (const [cq, cr] of clump) visited.add(`${cq},${cr}`);
                clumps.push(clump);
            }
        }
        return clumps;
    }

    // A clump is bounded if none of its board-adjacent cells are empty
    function isBounded(clump) {
        for (const [q, r] of clump) {
            for (const [nq, nr] of getHexNeighbors(q, r, SIZE)) {
                if (hexBoard.get(`${nq},${nr}`) === null) return false;
            }
        }
        return true;
    }

    // Determine which player claims a bounded clump.
    // Compare count of groups of largest size; if tied, move to next-largest; if tied all way down, opponent claims.
    function determineClaimer(clump, placer) {
        const opponent = placer === 'black' ? 'white' : 'black';
        const clumpSet = new Set(clump.map(([q, r]) => `${q},${r}`));

        // Find monochromatic connected sub-groups within the clump
        const visited = new Set();
        const blackSizes = [];
        const whiteSizes = [];

        for (const [q, r] of clump) {
            const key = `${q},${r}`;
            if (visited.has(key)) continue;
            const color = hexBoard.get(key).color;
            const group = [];
            const queue = [[q, r]];
            visited.add(key);
            while (queue.length > 0) {
                const [cq, cr] = queue.shift();
                group.push([cq, cr]);
                for (const [nq, nr] of getHexNeighbors(cq, cr, SIZE)) {
                    const nkey = `${nq},${nr}`;
                    if (!visited.has(nkey) && clumpSet.has(nkey)) {
                        if (hexBoard.get(nkey).color === color) {
                            visited.add(nkey);
                            queue.push([nq, nr]);
                        }
                    }
                }
            }
            if (color === 'black') blackSizes.push(group.length);
            else whiteSizes.push(group.length);
        }

        // Compare group-size distributions from largest down
        const allSizes = [...new Set([...blackSizes, ...whiteSizes])].sort((a, b) => b - a);
        const bCount = new Map(), wCount = new Map();
        for (const s of blackSizes) bCount.set(s, (bCount.get(s) || 0) + 1);
        for (const s of whiteSizes) wCount.set(s, (wCount.get(s) || 0) + 1);

        for (const size of allSizes) {
            const bc = bCount.get(size) || 0;
            const wc = wCount.get(size) || 0;
            if (bc > wc) return 'black';
            if (wc > bc) return 'white';
        }
        // Fully tied → opponent claims
        return opponent;
    }

    // After each placement, recolor all bounded clumps to their claimer's color
    function resolveClaims(placer) {
        for (const clump of getAllClumps()) {
            if (!isBounded(clump)) continue;
            const claimer = determineClaimer(clump, placer);
            for (const [q, r] of clump) {
                const cell = hexBoard.get(`${q},${r}`);
                hexBoard.set(`${q},${r}`, { ...cell, color: claimer });
            }
        }
    }

    function isBoardFull() {
        for (const val of hexBoard.values()) {
            if (val === null) return false;
        }
        return true;
    }

    // Score = number of bounded clumps claimed by `color`.
    // At game end, the bounded clump containing the last-placed stone counts 0.5 instead of 1.
    function calculateScore(color) {
        let score = 0;
        for (const clump of getAllClumps()) {
            if (!isBounded(clump)) continue;
            const clumpColor = hexBoard.get(`${clump[0][0]},${clump[0][1]}`).color;
            if (clumpColor !== color) continue;
            const isLastClump = gameOver && lastMoveQ !== null &&
                clump.some(([q, r]) => q === lastMoveQ && r === lastMoveR);
            score += isLastClump ? 0.5 : 1;
        }
        return score;
    }

    function fmtScore(s) {
        return s % 1 === 0 ? s.toString() : s.toFixed(1);
    }

    // =====================================================================
    //  BOARD INIT & RENDER (from Stalk.html)
    // =====================================================================

    const EDGE_NEIGHBORS = [
        [1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]
    ];

    function initBoard() {
        const gridDiv  = document.getElementById('grid');
        const linesDiv = document.getElementById('lines');
        const boardEl  = document.getElementById('board');
        gridDiv.innerHTML  = '';
        linesDiv.innerHTML = '';

        const n = SIZE;
        const { w: boardWidth, h: boardHeight } = getBoardDimensions(n);
        boardEl.style.width  = boardWidth  + 'px';
        boardEl.style.height = boardHeight + 'px';
        const headerEl = document.querySelector('.header');
        if (headerEl) headerEl.style.width = boardWidth + 'px';

        const hexS     = (boardHeight - 3) / (3*n - 1);
        const circleR  = hexS * 3 / 4;
        const hexPieceR = hexS * Math.sqrt(Math.PI * SQRT3 / 8);
        const strokeW  = Math.max(1.5, hexS * 0.05);
        const cx0 = boardWidth  / 2;
        const cy0 = boardHeight / 2;

        // ---- Canvas for cell lines ----
        const canvas = document.createElement('canvas');
        canvas.width  = boardWidth;
        canvas.height = boardHeight;
        const ctx = canvas.getContext('2d');

        const cellVerts = new Map();
        for (const [q, r] of getAllCells(n)) {
            const [px, py] = hexToPixel(q, r, hexS);
            const hcx = cx0 + px, hcy = cy0 + py;
            const verts = [];
            for (let i = 0; i < 6; i++) {
                const angle = Math.PI / 3 * i - Math.PI / 6;
                verts.push([hcx + hexS * Math.cos(angle), hcy + hexS * Math.sin(angle)]);
            }
            cellVerts.set(`${q},${r}`, verts);
        }

        // Interior edges
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 1;
        for (const [q, r] of getAllCells(n)) {
            const verts = cellVerts.get(`${q},${r}`);
            for (let e = 0; e < 6; e++) {
                const [dq, dr] = EDGE_NEIGHBORS[e];
                const nq = q+dq, nr = r+dr;
                if (!onBoard(nq, nr, n)) continue;
                if (nq > q || (nq === q && nr > r)) {
                    ctx.beginPath();
                    ctx.moveTo(verts[e][0], verts[e][1]);
                    ctx.lineTo(verts[(e+1)%6][0], verts[(e+1)%6][1]);
                    ctx.stroke();
                }
            }
        }

        // Perimeter edges
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const [q, r] of getAllCells(n)) {
            const verts = cellVerts.get(`${q},${r}`);
            const [px, py] = hexToPixel(q, r, hexS);
            const hcx = cx0+px, hcy = cy0+py;
            for (let e = 0; e < 6; e++) {
                const [dq, dr] = EDGE_NEIGHBORS[e];
                if (!onBoard(q+dq, r+dr, n)) {
                    const p1 = verts[e], p2 = verts[(e+1)%6];
                    const mx = (p1[0]+p2[0])/2, my = (p1[1]+p2[1])/2;
                    let vx = mx-hcx, vy = my-hcy;
                    const len = Math.hypot(vx, vy);
                    if (len > 0.001) { vx /= len; vy /= len; }
                    const off = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(p1[0]+vx*off, p1[1]+vy*off);
                    ctx.lineTo(p2[0]+vx*off, p2[1]+vy*off);
                    ctx.stroke();
                }
            }
        }
        linesDiv.appendChild(canvas);

        // ---- SVG for pieces and click areas ----
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('width', boardWidth);
        svg.setAttribute('height', boardHeight);
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.overflow = 'visible';

        const pieceLayer = document.createElementNS(NS, 'g');
        pieceLayer.id = 'piece-layer';
        pieceLayer.style.pointerEvents = 'none';
        svg.appendChild(pieceLayer);

        const markerLayer = document.createElementNS(NS, 'g');
        markerLayer.id = 'marker-layer';
        markerLayer.style.pointerEvents = 'none';
        svg.appendChild(markerLayer);

        const clickLayer = document.createElementNS(NS, 'g');
        clickLayer.id = 'click-layer';
        svg.appendChild(clickLayer);

        for (const [q, r] of getAllCells(n)) {
            const [px, py] = hexToPixel(q, r, hexS);
            const hcx = cx0+px, hcy = cy0+py;

            const poly = document.createElementNS(NS, 'polygon');
            poly.setAttribute('points', hexPointsString(hcx, hcy, hexS));
            poly.setAttribute('fill', 'transparent');
            poly.setAttribute('stroke', 'none');
            poly.style.cursor = 'pointer';
            poly.dataset.q = q;
            poly.dataset.r = r;

            poly.addEventListener('mousedown', (e) => {
                if (gameOver) return;
                if (e.button === 1) e.preventDefault();
                let shape = null;
                if (e.button === 0) shape = 'circle';
                else if (e.button === 2) shape = 'hexagon';
                if (shape) {
                    if (hexBoard.get(`${q},${r}`) === null) {
                        place(q, r, shape);
                    } else {
                        setMessage("Position occupied.");
                    }
                }
            });
            poly.addEventListener('contextmenu', e => e.preventDefault());
            clickLayer.appendChild(poly);
        }

        gridDiv.appendChild(svg);
        window._hexParams = { hexS, circleR, hexPieceR, strokeW, cx0, cy0, boardWidth, boardHeight, n, NS };

        updateStatus();
        updateLastMoveDisplay();
    }

    function renderBoard() {
        const params = window._hexParams;
        if (!params) return;
        const { hexS, circleR, hexPieceR, strokeW, cx0, cy0, NS } = params;

        const pieceLayer  = document.getElementById('piece-layer');
        const markerLayer = document.getElementById('marker-layer');
        if (!pieceLayer || !markerLayer) return;

        pieceLayer.innerHTML  = '';
        markerLayer.innerHTML = '';

        for (const [q, r] of getAllCells(SIZE)) {
            const key = `${q},${r}`;
            const cell = hexBoard.get(key);
            const [px, py] = hexToPixel(q, r, hexS);
            const hcx = cx0+px, hcy = cy0+py;

            if (cell) {
                const { color, shape } = cell;
                if (shape === 'circle') {
                    const circle = document.createElementNS(NS, 'circle');
                    circle.setAttribute('cx', hcx);
                    circle.setAttribute('cy', hcy);
                    circle.setAttribute('r', circleR);
                    circle.setAttribute('fill', color === 'black' ? 'black' : 'white');
                    circle.setAttribute('stroke', 'black');
                    circle.setAttribute('stroke-width', strokeW);
                    pieceLayer.appendChild(circle);
                } else {
                    // hexagon piece
                    const poly = document.createElementNS(NS, 'polygon');
                    poly.setAttribute('points', hexPointsString(hcx, hcy, hexPieceR));
                    poly.setAttribute('fill', color === 'black' ? 'rgb(75,91,138)' : 'rgb(195,213,255)');
                    poly.setAttribute('stroke', 'black');
                    poly.setAttribute('stroke-width', strokeW);
                    pieceLayer.appendChild(poly);
                }
            }

            // Last-move marker
            if (q === lastMoveQ && r === lastMoveR) {
                const dot = document.createElementNS(NS, 'circle');
                dot.setAttribute('cx', hcx);
                dot.setAttribute('cy', hcy);
                dot.setAttribute('r', circleR * 0.22);
                dot.setAttribute('fill', 'red');
                markerLayer.appendChild(dot);
            }
        }
    }

    // =====================================================================
    //  MOVE EXECUTION
    // =====================================================================

    function place(q, r, shape) {
        if (hexBoard.get(`${q},${r}`) !== null) {
            setMessage("Position occupied.");
            return;
        }
        const placer = turn;
        hexBoard.set(`${q},${r}`, { color: placer, shape });
        lastMoveQ = q;
        lastMoveR = r;
        lastShape = shape;
        resolveClaims(placer);
        turn = placer === 'black' ? 'white' : 'black';
        gameOver = isBoardFull();

        if (currentMoveIndex < gameHistory.length - 1) {
            gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
        }
        gameHistory.push(saveGameState());
        currentMoveIndex++;

        renderBoard();
        updateStatus();
        updateLastMoveDisplay();
        updateReplayButtons();
    }

    // =====================================================================
    //  STATE MANAGEMENT
    // =====================================================================

    function saveGameState() {
        const boardData = {};
        for (const [key, val] of hexBoard) boardData[key] = val ? { ...val } : null;
        return {
            board: boardData,
            turn,
            lastMoveQ,
            lastMoveR,
            lastShape,
            gameOver
        };
    }

    function loadGameState(state) {
        initHexBoard(SIZE);
        for (const [key, val] of Object.entries(state.board)) {
            hexBoard.set(key, val ? { ...val } : null);
        }
        turn      = state.turn;
        lastMoveQ = state.lastMoveQ;
        lastMoveR = state.lastMoveR;
        lastShape = state.lastShape;
        gameOver  = state.gameOver;
        renderBoard();
        updateStatus();
        updateLastMoveDisplay();
    }

    function resetGame(newSize) {
        SIZE = newSize;
        initHexBoard(SIZE);
        turn = 'black';
        lastMoveQ = lastMoveR = lastShape = null;
        gameOver = false;
        gameHistory = [saveGameState()];
        currentMoveIndex = 0;
        clearMessage();
        initBoard();
        updateReplayButtons();
        renderBoard();
        updateLastMoveDisplay();
    }

    function changeBoardSize() {
        const select = document.getElementById('board-size');
        resetGame(parseInt(select.value));
        select.blur();
    }


    // =====================================================================
    //  STATUS DISPLAY
    // =====================================================================

    function updateStatus() {
        const turnStatus  = document.getElementById('turn-status');
        const scoreStatus = document.getElementById('score-status');

        const bScore = calculateScore('black');
        const wScore = calculateScore('white');

        scoreStatus.innerHTML =
            `${fmtScore(bScore)}<span class="left-spacing">${blackPieceSVG}</span> ` +
            `${fmtScore(wScore)}<span class="left-spacing">${whitePieceSVG}</span>`;

        const isAtEnd = currentMoveIndex === gameHistory.length - 1;
        if (gameOver && isAtEnd) {
            const diff = bScore - wScore;
            let result;
            if (diff > 1e-9)       result = `${blackPieceSVG} wins by ${fmtScore(diff)}!`;
            else if (diff < -1e-9) result = `${whitePieceSVG} wins by ${fmtScore(-diff)}!`;
            else                   result = 'Tie!';
            turnStatus.innerHTML = result;
        } else {
            const icon = turn === 'black' ? blackPieceSVG : whitePieceSVG;
            turnStatus.innerHTML = `${icon} to move`;
        }

        adjustHeaderLayout();
    }

    // =====================================================================
    //  REPLAY
    // =====================================================================

    function replayStart() {
        currentMoveIndex = 0;
        loadGameState(gameHistory[0]);
        clearMessage();
        updateReplayButtons();
        updateLastMoveDisplay();
    }

    function replayBack() {
        if (currentMoveIndex > 0) {
            currentMoveIndex--;
            loadGameState(gameHistory[currentMoveIndex]);
            clearMessage();
            updateReplayButtons();
            updateLastMoveDisplay();
        }
    }

    function replayForward() {
        if (currentMoveIndex < gameHistory.length - 1) {
            currentMoveIndex++;
            loadGameState(gameHistory[currentMoveIndex]);
            clearMessage();
            updateReplayButtons();
            updateLastMoveDisplay();
        }
    }

    function replayEnd() {
        currentMoveIndex = gameHistory.length - 1;
        loadGameState(gameHistory[currentMoveIndex]);
        clearMessage();
        updateReplayButtons();
        updateLastMoveDisplay();
    }

    function updateReplayButtons() {
        const buttons    = document.querySelectorAll('.replay-controls button');
        const startBtn   = buttons[0];
        const backBtn    = buttons[1];
        const forwardBtn = buttons[2];
        const endBtn     = buttons[3];
        const randomBtn  = document.getElementById('random-button');

        const isAtStart = currentMoveIndex === 0;
        const isAtEnd   = currentMoveIndex === gameHistory.length - 1;

        startBtn.disabled   = isAtStart || isGenerating;
        backBtn.disabled    = isAtStart || isGenerating;
        forwardBtn.disabled = isAtEnd   || isGenerating;
        endBtn.disabled     = isAtEnd   || isGenerating;
        randomBtn.disabled  = false; // always clickable (resets if game over)
    }

    // =====================================================================
    //  RANDOM GAME
    // =====================================================================

    function stopGeneration() {
        if (generationInterval) {
            clearInterval(generationInterval);
            generationInterval = null;
        }
        isGenerating = false;
        const randomBtn = document.getElementById('random-button');
        randomBtn.style.width = '';
        randomBtn.textContent = 'Random game';
        randomBtn.setAttribute('onmousedown', 'generateRandomGame()');
        updateReplayButtons();
        updateStatus();
        renderBoard();
    }

    function measureRandomGameWidth() {
        const randomBtn = document.getElementById('random-button');
        const clone = randomBtn.cloneNode(true);
        clone.textContent = 'Random game';
        clone.style.width = '';
        clone.style.visibility = 'hidden';
        clone.style.position = 'absolute';
        document.body.appendChild(clone);
        const w = clone.offsetWidth;
        document.body.removeChild(clone);
        return w;
    }

    function generateRandomGame() {
        if (isGenerating) { stopGeneration(); return; }
        if (gameOver) resetGame(SIZE);
        isGenerating = true;
        const randomBtn = document.getElementById('random-button');
        randomBtn.style.width = `${measureRandomGameWidth()}px`;
        randomBtn.textContent = 'Stop';
        randomBtn.setAttribute('onmousedown', 'stopGeneration()');
        updateReplayButtons();

        generationInterval = setInterval(() => {
            if (isBoardFull()) { stopGeneration(); return; }
            const empties = getAllCells(SIZE).filter(([q, r]) => hexBoard.get(`${q},${r}`) === null);
            if (empties.length === 0) { stopGeneration(); return; }
            const [q, r] = empties[Math.floor(Math.random() * empties.length)];
            const shape = Math.random() < 0.5 ? 'circle' : 'hexagon';
            place(q, r, shape);
        }, 1);
    }

    // =====================================================================
    //  LAST MOVE DISPLAY & COPY
    // =====================================================================

    function updateLastMoveDisplay() {
        const lastMoveText = document.getElementById('last-move-text');
        const copyButton   = document.getElementById('copy-move');

        if (currentMoveIndex < 1 || lastMoveQ === null || lastShape === null) {
            lastMoveText.textContent = '';
            copyButton.style.display = 'none';
            return;
        }

        const state = gameHistory[currentMoveIndex];
        const playerSymbol = state.turn === 'black' ? 'W' : 'B';
        const shapeChar = state.lastShape === 'circle' ? 'C' : 'H';
        const col = String.fromCharCode(97 + state.lastMoveQ + (SIZE - 1));
        const row = state.lastMoveR + SIZE;
        lastMoveText.textContent = `${playerSymbol}${shapeChar}${col}${row}`;
        copyButton.style.display = 'inline-flex';
    }

    function copyLastMove() {
        const text = document.getElementById('last-move-text').textContent;
        if (text) navigator.clipboard.writeText(text).then(() => setMessage('Copied!'));
    }

    // =====================================================================
    //  SAVE / LOAD
    // =====================================================================

    function generateGameRecordText(history, sz) {
        const moves = [`hmx${sz}`];
        for (let i = 1; i < history.length; i++) {
            const state = history[i];
            const prevTurn = history[i-1].turn;
            const psym = prevTurn === 'black' ? 'B' : 'W';
            if (state.lastMoveQ !== null && state.lastShape !== null) {
                const shapeChar = state.lastShape === 'circle' ? 'C' : 'H';
                const col = String.fromCharCode(97 + state.lastMoveQ + (sz - 1));
                const row = state.lastMoveR + sz;
                moves.push(`${psym}${shapeChar}${col}${row}`);
            }
        }
        return moves.join(' ');
    }

    function processGameRecordText(text) {
        text = text.trim();
        if (!text) return false;
        const parts = text.split(/\s+/);
        const sizeMatch = parts[0].match(/^hmx(\d+)$/i);
        if (!sizeMatch) { setMessage("Invalid format (expected hmxN ...)."); return false; }
        const newSize = parseInt(sizeMatch[1]);
        if (newSize < 3 || newSize > 10) { setMessage("Board size must be 3–10."); return false; }

        let startIdx = 1;
        if (parts.length > 1 && !isNaN(parseInt(parts[1])) && parseInt(parts[1]) >= 0 && parseInt(parts[1]) <= 20) {
            startIdx = 2; // skip legacy komi field if present
        }

        resetGame(newSize);
        document.getElementById('board-size').value = newSize;

        let expectedPlayer = 'black';
        for (let i = startIdx; i < parts.length; i++) {
            const m = parts[i].match(/^([BW])([CH])([a-z])(\d+)$/i);
            if (!m) { setMessage(`Invalid move: ${parts[i]}`); return false; }
            const [, pSym, sChar, colChar, rowStr] = m;
            const player = pSym.toUpperCase() === 'B' ? 'black' : 'white';
            const shape = sChar.toUpperCase() === 'C' ? 'circle' : 'hexagon';
            const q = colChar.toLowerCase().charCodeAt(0) - 97 - (newSize - 1);
            const r = parseInt(rowStr) - newSize;

            if (player !== expectedPlayer) { setMessage(`Turn mismatch at ${parts[i]}`); return false; }
            if (!onBoard(q, r, newSize)) { setMessage(`Move out of bounds: ${parts[i]}`); return false; }
            if (hexBoard.get(`${q},${r}`) !== null) { setMessage(`Position occupied: ${parts[i]}`); return false; }

            place(q, r, shape);
            expectedPlayer = expectedPlayer === 'black' ? 'white' : 'black';
        }
        clearMessage();
        return true;
    }

    function handleSave() {
        const select = document.getElementById('save-options');
        const option = select.value;
        if (!option) return;
        const text = generateGameRecordText(gameHistory, SIZE);
        if (option === 'file') {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'hexmander_game.txt'; a.click();
            URL.revokeObjectURL(url);
        } else if (option === 'clipboard') {
            navigator.clipboard.writeText(text).then(() => setMessage('Copied to clipboard!'));
        }
        select.value = '';
        select.blur();
    }

    function loadGame(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => processGameRecordText(e.target.result);
        reader.readAsText(file);
        event.target.value = '';
    }

    function handleLoad() {
        const select = document.getElementById('load-options');
        const option = select.value;
        if (option === 'file') document.getElementById('load-input').click();
        else if (option === 'clipboard') {
            navigator.clipboard.readText().then(text => processGameRecordText(text))
                .catch(() => setMessage('Failed to read clipboard.'));
        }
        select.value = '';
        select.blur();
    }

    // =====================================================================
    //  UI UTILITIES
    // =====================================================================

    function clearMessage() { document.getElementById('message').textContent = ''; }
    function setMessage(text) {
        document.getElementById('message').textContent = text;
        setTimeout(clearMessage, 3000);
    }

    function adjustHeaderLayout() {
        const header        = document.querySelector('.header');
        const statusLeft    = document.querySelector('.status-left');
        const statusCenter  = document.querySelector('.status-center');
        const controlsRight = document.querySelector('.controls-right');

        const headerWidth  = header.offsetWidth;
        const leftWidth    = statusLeft.offsetWidth;
        const centerWidth  = statusCenter.offsetWidth;
        const rightWidth   = controlsRight.offsetWidth;

        statusCenter.style.position  = 'absolute';
        statusCenter.style.left      = '50%';
        statusCenter.style.transform = 'translateX(-50%)';
        statusLeft.style.position    = 'absolute';
        controlsRight.style.position = 'absolute';
        statusLeft.style.left        = '0';
        controlsRight.style.right    = '0';

        const centerLeft  = (headerWidth - centerWidth) / 2;
        const centerRight = centerLeft + centerWidth;
        const leftOverlap  = leftWidth  > centerLeft;
        const rightOverlap = rightWidth > (headerWidth - centerRight);

        if (leftOverlap || rightOverlap) {
            const leftPush  = leftOverlap  ? leftWidth  - centerLeft                   : 0;
            const rightPush = rightOverlap ? rightWidth - (headerWidth - centerRight)  : 0;
            if (leftPush  > 0) statusLeft.style.left    = `-${leftPush}px`;
            if (rightPush > 0) controlsRight.style.right = `-${rightPush}px`;
        } else {
            statusLeft.style.left    = '0';
            controlsRight.style.right = '0';
        }
    }

    // =====================================================================
    //  INIT
    // =====================================================================

    resetGame(SIZE);
    adjustHeaderLayout();

    document.getElementById('copy-move').addEventListener('mousedown', copyLastMove);

    const boardSizeSelect = document.getElementById('board-size');
    const saveSelect      = document.getElementById('save-options');
    const loadSelect      = document.getElementById('load-options');

    [boardSizeSelect, saveSelect, loadSelect].forEach(el => {
        el.addEventListener('keydown', (e) => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
        });
    });

    window.addEventListener('resize', () => {
        initBoard();
        renderBoard();
        if (isGenerating) {
            const randomBtn = document.getElementById('random-button');
            randomBtn.style.width = `${measureRandomGameWidth()}px`;
        }
        adjustHeaderLayout();
    });

    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.deltaY > 0) replayForward();
        else if (e.deltaY < 0) replayBack();
    }, { passive: false });

    document.querySelectorAll('.replay-controls select').forEach(sel => {
        sel.addEventListener('change', () => {
            if (sel.id === 'save-options' || sel.id === 'load-options') sel.value = '';
            sel.blur();
        });
    });

    window.addEventListener('keydown', (event) => {
        const activeElement  = document.activeElement;
        const isInputFocused = activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA';
        const keysToPrevent  = ['r','i','o','a','s','z','x','c','arrowup','arrowdown','arrowleft','arrowright'];

        if (isInputFocused && activeElement.tagName === 'SELECT' && ['ArrowUp','ArrowDown','Space'].includes(event.key)) {
            // allow default select navigation
        } else if (isInputFocused && (event.key.toLowerCase() === 'c' && (event.metaKey || event.ctrlKey))) {
            // allow system copy
        } else if (isInputFocused && (event.key.toLowerCase() === 'x' && (event.metaKey || event.ctrlKey))) {
            // allow system cut
        } else if (isInputFocused && (event.key.toLowerCase() === 'z' && (event.metaKey || event.ctrlKey))) {
            // allow system undo
        } else if (keysToPrevent.includes(event.key.toLowerCase())) {
            event.preventDefault();
        } else {
            return;
        }

        switch (event.key.toLowerCase()) {
            case 'r': if (isGenerating) stopGeneration(); else generateRandomGame(); break;
            case 'i':
                if (boardSizeSelect && document.activeElement !== boardSizeSelect) {
                    boardSizeSelect.selectedIndex = Math.max(0, boardSizeSelect.selectedIndex - 1);
                    boardSizeSelect.dispatchEvent(new Event('change'));
                } break;
            case 'o':
                if (boardSizeSelect && document.activeElement !== boardSizeSelect) {
                    boardSizeSelect.selectedIndex = Math.min(boardSizeSelect.options.length - 1, boardSizeSelect.selectedIndex + 1);
                    boardSizeSelect.dispatchEvent(new Event('change'));
                } break;
            case 'a':
                if (loadSelect) { loadSelect.value = 'file'; loadSelect.dispatchEvent(new Event('change')); } break;
            case 's':
                if (saveSelect) { saveSelect.value = 'file'; saveSelect.dispatchEvent(new Event('change')); } break;
            case 'c': copyLastMove(); break;
            case 'z':
                if (loadSelect) { loadSelect.value = 'clipboard'; loadSelect.dispatchEvent(new Event('change')); } break;
            case 'x':
                if (saveSelect) { saveSelect.value = 'clipboard'; saveSelect.dispatchEvent(new Event('change')); } break;
        }

        if (document.activeElement.tagName !== 'SELECT' && !isInputFocused) {
            switch (event.key) {
                case 'ArrowUp':    replayStart();   break;
                case 'ArrowDown':  replayEnd();     break;
                case 'ArrowLeft':  replayBack();    break;
                case 'ArrowRight': replayForward(); break;
            }
        }
    });
</script>
</body>
</html>
