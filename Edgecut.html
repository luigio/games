<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edgecut</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            max-width: 100%;
        }

        .header {
            width: min(100vw, calc(100vh - 100px));
            height: 50px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto;
            overflow: visible;
        }

        .status-left {
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: absolute;
            left: 0;
            z-index: 1;
            padding-right: 0.5em;
        }

        .controls-right {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: absolute;
            right: 0;
            z-index: 1;
            gap: 0.5em;
        }

        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #f0f0f0;
        }

        .footer {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board {
            width: min(100vw, calc(100vh - 100px));
            height: min(100vw, calc(100vh - 100px));
            background-color: #d9a359;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #last-move-text {
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            white-space: nowrap;
        }

        #copy-move {
            font-size: 1.2em;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-icon {
            width: 1em;
            height: 1em;
            vertical-align: middle;
        }

        #copy-move:hover .copy-icon path {
            fill: #555;
        }

        .grid {
            display: grid;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        .lines {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .point {
            position: relative;
            cursor: pointer;
        }

        .stone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            z-index: 2;
        }

        .black {
            background: black;
        }

        .white {
            background: white;
        }

        .point.last-move::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22%;
            height: 22%;
            border-radius: 50%;
            background: red;
            z-index: 3;
        }

        .swap-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: 20%;
            border-radius: 50%;
            z-index: 3;
        }

        .swap-dot.swap-black {
            background: white;
        }

        .swap-dot.swap-white {
            background: black;
        }

        .replay-controls {
            display: flex;
            flex-wrap: nowrap;
            width: 100%;
            gap: 0.5em;
            overflow: hidden;
            justify-content: center;
        }

        .replay-controls button,
        .replay-controls select {
            flex: 0 1 auto;
            padding: 0.3em 0.5em;
            font-size: 1em;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            transition: background 0.3s ease;
            min-width: 0;
            text-overflow: clip;
            overflow: hidden;
            white-space: nowrap;
            max-width: 100px;
        }

        button, select {
            font-size: 1em;
            padding: 0.3em 0.5em;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:not(:disabled):hover, select:hover {
            background: #FFF5E9;
        }

        select {
            cursor: pointer;
            text-align: center;
        }

        .replay-controls button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .stone-icon {
            width: 1em;
            height: 1em;
            vertical-align: middle;
            margin-right: 0.5em;
        }

        .sq {
            padding: 0 !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #message {
            font-family: Arial, sans-serif;
            position: absolute;
            left: calc(50vw + 50vh - 30px);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            color: #d32f2f;
            width: 20vw;
            text-align: left;
        }

        .left-spacing {
            margin-left: 0.5em;
        }

        #random-button {
            flex: 0 1 auto;
            min-width: 0;
        }

        #bot-reply-button {
            flex: 0 1 auto;
            min-width: 0;
            max-width: 8em;
        }

        #save-options, #load-options {
            flex: 0 1 auto;
            min-width: 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="status-left" id="turn-status"></div>
        <div class="controls-right">
            <div id="last-move-display" style="display: flex; align-items: center; gap: 0.5em;">
                <span id="last-move-text"></span>
                <button id="copy-move" title="Copy last move" style="display: none;">
                    <svg class="copy-icon" viewBox="0 0 24 24">
                        <path fill="black" d="M19 21H8V7h11m0-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-3-4H4a2 2 0 0 0-2 2v14h2V3h12V1z"/>
                    </svg>
                </button>
            </div>
            <button id="hold-button" onmousedown="hold()" style="display: none;">Hold</button>
        </div>
    </div>
    <div class="board-container">
        <div class="board" id="board">
            <div class="lines" id="lines"></div>
            <div class="grid" id="grid"></div>
        </div>
        <div id="message"></div>
    </div>
    <div class="footer">
        <div class="replay-controls">
            <button class="sq" onmousedown="replayStart()" title="Go to start" data-tooltip="Go to start"><<</button>
            <button class="sq" onmousedown="replayBack()" title="Previous move" data-tooltip="Previous move"><</button>
            <button class="sq" onmousedown="replayForward()" title="Next move" data-tooltip="Next move">></button>
            <button class="sq" onmousedown="replayEnd()" title="Go to end" data-tooltip="Go to end">>></button>
            <button class="sq" id="random-button" onmousedown="generateRandomGame()" title="Generate random game" data-tooltip="Generate random game" data-tooltip-alt="Stop generation">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="17" r="1.5" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="sq" id="bot-reply-button" onmousedown="toggleBotReply()" title="Bot reply is OFF" data-tooltip="Bot reply is OFF" data-tooltip-alt="Bot reply is ON">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="1" y="8" width="3" height="5" rx="1"/><rect x="20" y="8" width="3" height="5" rx="1"/><line x1="7" y1="8.75" x2="10.5" y2="8.75"/><line x1="13.5" y1="8.75" x2="17" y2="8.75"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
            </button>
            <select id="save-options" onchange="handleSave()" data-tooltip="Save game">
                <option value="" disabled selected hidden>Save</option>
                <option value="file">To file</option>
                <option value="clipboard">To clipboard</option>
            </select>

            <select id="load-options" onchange="handleLoad()" data-tooltip="Load game">
                <option value="" disabled selected hidden>Load</option>
                <option value="file">From file</option>
                <option value="clipboard">From clipboard</option>
            </select>
            <select id="board-size" onchange="changeBoardSize()" data-tooltip="Board size">
                <option value="4">4×4</option>
                <option value="6">6×6</option>
                <option value="8">8×8</option>
                <option value="10">10×10</option>
                <option value="12">12×12</option>
                <option value="14">14×14</option>
                <option value="16">16×16</option>
                <option value="18">18×18</option>
                <option value="20">20×20</option>
                <option value="22">22×22</option>
                <option value="24" selected>24×24</option>
                <option value="26">26×26</option>
                <option value="28">28×28</option>
                <option value="30">30×30</option>
                <option value="32">32×32</option>
                <option value="34">34×34</option>
                <option value="36">36×36</option>
            </select>
            <input type="file" id="load-input" style="display: none;" accept=".txt" onchange="loadGame(event)">
        </div>
    </div>
</div>

<script>
    let SIZE = 13;
    let board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
    let turn = 0; // 0 for Black, 1 for White, convenience variable
    let lastMoveX = null;
    let lastMoveY = null;
    let lastMoveX2 = null; // second point of the last completed move's marker
    let lastMoveY2 = null;
    let gameHistory = [];
    let currentMoveIndex = -1;
    let isGenerating = false;
    let generationInterval = null;
    let swapTargets = null;
    let pendingSelectedAt = 0; // timestamp a swap source was selected, for double-click cooloff
    let gameOver = false;
    let blackWins = false;
    let whiteWins = false;
    let isDraw = false;
    let botReply = false;

    const blackStoneSVG = `<svg class="stone-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="black"/></svg>`;
    const whiteStoneSVG = `<svg class="stone-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="white" stroke="black" stroke-width="5"/></svg>`;

    function initBoard() {
        const gridDiv = document.getElementById('grid');
        gridDiv.innerHTML = '';
        const linesDiv = document.getElementById('lines');
        linesDiv.innerHTML = '';
        
        const canvas = document.createElement('canvas');
        const boardSize = document.getElementById('board').offsetWidth;
        canvas.width = boardSize;
        canvas.height = boardSize;
        const ctx = canvas.getContext('2d');
        const cellSize = boardSize / SIZE;
        
        gridDiv.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
        gridDiv.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;

        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const point = document.createElement('div');
                point.className = 'point';
                point.dataset.x = i;
                point.dataset.y = j;
                point.onmousedown = () => play(i, j);
                const stone = document.createElement('div');
                stone.className = 'stone';
                point.appendChild(stone);
                gridDiv.appendChild(point);
            }
        }

        // Draw all thin black grid lines first
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 1;
        for (let i = 0; i < SIZE; i++) {
            const pos = cellSize / 2 + i * cellSize;
            ctx.beginPath();
            ctx.moveTo(pos, cellSize / 2);
            ctx.lineTo(pos, boardSize - cellSize / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cellSize / 2, pos);
            ctx.lineTo(boardSize - cellSize / 2, pos);
            ctx.stroke();
        }

        // Draw thick edges last (black for top/bottom, white for left/right)
        ctx.lineWidth = 5;
        // Top edge (black)
        ctx.strokeStyle = 'black';
        ctx.beginPath();
        ctx.moveTo(cellSize / 2, cellSize / 2);
        ctx.lineTo(boardSize - cellSize / 2, cellSize / 2);
        ctx.stroke();
        // Bottom edge (black)
        ctx.beginPath();
        ctx.moveTo(cellSize / 2, boardSize - cellSize / 2);
        ctx.lineTo(boardSize - cellSize / 2, boardSize - cellSize / 2);
        ctx.stroke();
        // Left edge (white)
        ctx.strokeStyle = 'white';
        ctx.beginPath();
        ctx.moveTo(cellSize / 2, cellSize / 2);
        ctx.lineTo(cellSize / 2, boardSize - cellSize / 2);
        ctx.stroke();
        // Right edge (white)
        ctx.beginPath();
        ctx.moveTo(boardSize - cellSize / 2, cellSize / 2);
        ctx.lineTo(boardSize - cellSize / 2, boardSize - cellSize / 2);
        ctx.stroke();

        // Miter the four corners: each 5×5 overlap square is split along a 45° diagonal
        // into two filled triangles so the black (horizontal) and white (vertical) edges
        // meet cleanly with no crude overlap.
        {
            const e = ctx.lineWidth / 2; // 2.5px — half the border stroke width
            const h = cellSize / 2;      // center of the corner squares
            const W = boardSize;
            function tri(color, x1,y1, x2,y2, x3,y3) {
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3);
                ctx.closePath(); ctx.fill();
            }
            // Top-left: diagonal from outer (h-e,h-e) to inner (h+e,h+e)
            tri('black', h-e,h-e, h+e,h-e, h+e,h+e);   // upper-right → black (top edge)
            tri('white', h-e,h-e, h-e,h+e, h+e,h+e);   // lower-left  → white (left edge)
            // Top-right: diagonal from outer (W-h+e,h-e) to inner (W-h-e,h+e)
            tri('black', W-h-e,h-e, W-h+e,h-e, W-h-e,h+e);  // upper-left  → black (top edge)
            tri('white', W-h+e,h-e, W-h+e,h+e, W-h-e,h+e);  // lower-right → white (right edge)
            // Bottom-left: diagonal from outer (h-e,W-h+e) to inner (h+e,W-h-e)
            tri('black', h-e,W-h+e, h+e,W-h+e, h+e,W-h-e);  // lower-right → black (bottom edge)
            tri('white', h-e,W-h-e, h+e,W-h-e, h-e,W-h+e);  // upper-left  → white (left edge)
            // Bottom-right: diagonal from outer (W-h+e,W-h+e) to inner (W-h-e,W-h-e)
            tri('black', W-h-e,W-h+e, W-h+e,W-h+e, W-h-e,W-h-e);  // lower-left  → black (bottom edge)
            tri('white', W-h+e,W-h-e, W-h+e,W-h+e, W-h-e,W-h-e);  // upper-right → white (right edge)
        }
        
        linesDiv.appendChild(canvas);
        updateStatus();
        updateLastMoveDisplay();
        updateButtonTooltips();
        adjustHeaderLayout();
    }

    function saveGameState() {
        const bWins = checkWin(0);
        const wWins = checkWin(1);
        // If neither side has connected and no legal swap remains anywhere on the
        // board, the game is permanently stuck (a draw) -- since Edgecut moves
        // aren't tied to either player's color, "no legal move" means neither
        // player can ever move again, not just the player to act.
        const stuck = !bWins && !wWins && !hasValidMove();
        return {
            board: board.map(row => [...row]),
            turn: turn,
            lastMoveX: lastMoveX,
            lastMoveY: lastMoveY,
            lastMoveX2: lastMoveX2,
            lastMoveY2: lastMoveY2,
            gameOver: bWins || wWins || stuck,
            blackWins: bWins,
            whiteWins: wWins,
            isDraw: stuck
        };
    }

    function loadGameState(state) {
        board = state.board.map(row => [...row]);
        turn = (state.turn !== undefined) ? state.turn : (currentMoveIndex % 2 === 0 ? 0 : 1);
        lastMoveX = state.lastMoveX;
        lastMoveY = state.lastMoveY;
        lastMoveX2 = (state.lastMoveX2 !== undefined) ? state.lastMoveX2 : null;
        lastMoveY2 = (state.lastMoveY2 !== undefined) ? state.lastMoveY2 : null;
        blackWins = state.blackWins;
        whiteWins = state.whiteWins;
        gameOver = state.gameOver;
        isDraw = !!state.isDraw;
        swapTargets = null;
        renderBoard();
        updateStatus();
        updateLastMoveDisplay();
    }

    function resetGame(newSize) {
        SIZE = newSize;
        // Edgecut starts from a full checkerboard, not an empty board.
        board = Array(SIZE).fill().map((_, r) => Array(SIZE).fill(null).map((_, c) => (r + c) % 2 === 0 ? 0 : 1));
        turn = 0; // Black moves first
        lastMoveX = null;
        lastMoveY = null;
        lastMoveX2 = null;
        lastMoveY2 = null;
        gameOver = false;
        blackWins = false;
        whiteWins = false;
        isDraw = false;
        const initialState = saveGameState();
        initialState.turn = 0;
        initialState.initialX = null;
        initialState.initialY = null;
        initialState.swapX = null;
        initialState.swapY = null;
        gameHistory = [initialState];
        currentMoveIndex = 0;
        swapTargets = null;
        pendingSelectedAt = 0;
        clearMessage();
        initBoard();
        renderBoard();
        updateReplayButtons();
        updateLastMoveDisplay();
    }

    function changeBoardSize() {
        const select = document.getElementById('board-size');
        const newSize = parseInt(select.value);
        resetGame(newSize);
    }

    function clearLastMoveMarker() {
        const points = document.getElementsByClassName('point');
        if (lastMoveX !== null && lastMoveY !== null) {
            points[lastMoveX * SIZE + lastMoveY].classList.remove('last-move');
        }
        if (lastMoveX2 !== null && lastMoveY2 !== null) {
            points[lastMoveX2 * SIZE + lastMoveY2].classList.remove('last-move');
        }
        lastMoveX = null;
        lastMoveY = null;
        lastMoveX2 = null;
        lastMoveY2 = null;
    }

    // Marks a single point (used while a swap source is selected but its
    // partner hasn't been chosen yet).
    function setLastMoveMarker(x, y) {
        clearLastMoveMarker();
        const points = document.getElementsByClassName('point');
        points[x * SIZE + y].classList.add('last-move');
        lastMoveX = x;
        lastMoveY = y;
    }

    // Marks both points affected by a completed move.
    function setLastMoveMarkers(x1, y1, x2, y2) {
        clearLastMoveMarker();
        const points = document.getElementsByClassName('point');
        points[x1 * SIZE + y1].classList.add('last-move');
        points[x2 * SIZE + y2].classList.add('last-move');
        lastMoveX = x1;
        lastMoveY = y1;
        lastMoveX2 = x2;
        lastMoveY2 = y2;
    }

    // Re-displays the marker for the last actually-completed move, discarding
    // whatever marker a cancelled in-progress selection had put on the board.
    function restorePreviousLastMove() {
        const state = gameHistory[currentMoveIndex];
        lastMoveX = state ? state.lastMoveX : null;
        lastMoveY = state ? state.lastMoveY : null;
        lastMoveX2 = (state && state.lastMoveX2 !== undefined) ? state.lastMoveX2 : null;
        lastMoveY2 = (state && state.lastMoveY2 !== undefined) ? state.lastMoveY2 : null;
        renderBoard();
    }

    // Cancels a swap that has a source selected but no partner chosen yet.
    function cancelPendingSwap() {
        swapTargets = null;
        pendingSelectedAt = 0;
        clearMessage();
        restorePreviousLastMove();
        updateReplayButtons();
    }

    function setMessage(msg) {
        document.getElementById('message').textContent = msg;
    }

    function clearMessage() {
        document.getElementById('message').textContent = '';
    }

    // Distance from index v (a row or column) to the nearer of the two opposite
    // board edges along that axis.
    function rho(v) {
        return Math.min(v, SIZE - 1 - v);
    }

    // "Distance from center" of the 2x2 crosscut block whose top-left corner is
    // (i, j): larger = closer to the board's center, smaller = closer to the
    // outer edge (0 = the block touches the edge).
    function mValue(i, j) {
        return Math.min(rho(i), rho(i + 1), rho(j), rho(j + 1));
    }

    // Whether the 2x2 block with top-left corner (i, j) currently forms a
    // crosscut (a diagonal BW/WB pattern).
    function isCrosscut(i, j) {
        if (i < 0 || j < 0 || i > SIZE - 2 || j > SIZE - 2) return false;
        const a = board[i][j], b = board[i][j + 1], c = board[i + 1][j], d = board[i + 1][j + 1];
        if (a === null || b === null || c === null || d === null) return false;
        return a === d && b === c && a !== b;
    }

    // Every 2x2 block (given by its top-left corner) that contains cell (x, y).
    function blocksTouchingCell(x, y) {
        const blocks = [];
        for (const i of [x - 1, x]) {
            if (i < 0 || i > SIZE - 2) continue;
            for (const j of [y - 1, y]) {
                if (j < 0 || j > SIZE - 2) continue;
                blocks.push([i, j]);
            }
        }
        return blocks;
    }

    // Whether swapping the orthogonally-adjacent cells (x1,y1) and (x2,y2) is a
    // legal move: the pair must be one of the 4 edges of a crosscut currently
    // on the board (swapping it always destroys that crosscut -- "kills" it).
    // The swap can also change the crosscut-status of any OTHER 2x2 block that
    // shares a cell with the swapped pair -- only those blocks can possibly
    // change, so only they need to be re-checked. Among the blocks that lose
    // crosscut status ("killed"), take the one closest to the center; every
    // block that newly gains crosscut status ("created") must be strictly
    // farther from the center than that.
    function isLegalSwap(x1, y1, x2, y2) {
        if (x2 < 0 || x2 >= SIZE || y2 < 0 || y2 >= SIZE) return false;

        const touch1 = blocksTouchingCell(x1, y1);
        const touch2 = blocksTouchingCell(x2, y2);

        // The pair must be an edge of at least one block that has BOTH cells
        // as corners and currently forms a crosscut. (Checking "some touched
        // block changed status" is NOT an equivalent test: a block touching
        // only x1,y1 -- with x2,y2 not even one of its corners -- can flip
        // status purely from that single cell changing, which would wrongly
        // count as legal if we didn't check this explicitly.)
        const hasQualifyingParent = touch1.some(([i, j]) =>
            isCrosscut(i, j) && touch2.some(([i2, j2]) => i2 === i && j2 === j)
        );
        if (!hasQualifyingParent) return false;

        const affected = [];
        const seen = new Set();
        for (const [i, j] of [...touch1, ...touch2]) {
            const key = i + ',' + j;
            if (!seen.has(key)) { seen.add(key); affected.push([i, j]); }
        }
        const before = affected.map(([i, j]) => isCrosscut(i, j));

        const tmp = board[x1][y1];
        board[x1][y1] = board[x2][y2];
        board[x2][y2] = tmp;

        const killed = [], created = [];
        affected.forEach(([i, j], idx) => {
            const was = before[idx], now = isCrosscut(i, j);
            if (was && !now) killed.push([i, j]);
            else if (!was && now) created.push([i, j]);
        });

        board[x2][y2] = board[x1][y1]; // undo the trial swap
        board[x1][y1] = tmp;

        // killed is guaranteed non-empty here (the qualifying parent block
        // above is always destroyed by the swap -- see comment on
        // getAllLegalMoves), but the check is kept as a safety net.
        if (killed.length === 0) return false;
        if (created.length === 0) return true;
        const centerOfKilled = Math.max(...killed.map(([i, j]) => mValue(i, j)));
        return created.every(([i, j]) => mValue(i, j) < centerOfKilled);
    }

    // Every legal swap-pair currently available anywhere on the board.
    function getAllLegalMoves() {
        const candidates = new Map();
        for (let i = 0; i <= SIZE - 2; i++) {
            for (let j = 0; j <= SIZE - 2; j++) {
                if (!isCrosscut(i, j)) continue;
                const edges = [
                    [[i, j], [i, j + 1]],
                    [[i + 1, j], [i + 1, j + 1]],
                    [[i, j], [i + 1, j]],
                    [[i, j + 1], [i + 1, j + 1]]
                ];
                for (const [[x1, y1], [x2, y2]] of edges) {
                    candidates.set(`${x1},${y1}-${x2},${y2}`, [[x1, y1], [x2, y2]]);
                }
            }
        }
        const moves = [];
        for (const [[x1, y1], [x2, y2]] of candidates.values()) {
            if (isLegalSwap(x1, y1, x2, y2)) moves.push([[x1, y1], [x2, y2]]);
        }
        return moves;
    }

    function hasValidMove() {
        return getAllLegalMoves().length > 0;
    }

    // The cells that a click on (x, y) could legally swap with.
    function getLegalPartners(x, y) {
        const partners = [];
        for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
            if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) continue;
            if (isLegalSwap(x, y, nx, ny)) partners.push([nx, ny]);
        }
        return partners;
    }

    function getChain(x, y, color, visited = new Set()) {
        if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || visited.has(`${x},${y}`) || board[x][y] !== color) {
            return [];
        }
        visited.add(`${x},${y}`);
        const chain = [[x, y]];
        for (const [dx, dy] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
            chain.push(...getChain(x + dx, y + dy, color, visited));
        }
        return chain;
    }

    function checkWin(color) {
        const visited = new Set();
        let startEdge, endEdge;
        if (color === 0) { // Black
            startEdge = 0; // Top
            endEdge = SIZE - 1; // Bottom
            for (let y = 0; y < SIZE; y++) {
                if (board[startEdge][y] === 0 && !visited.has(`${startEdge},${y}`)) {
                    const chain = getChain(startEdge, y, 0, visited);
                    if (chain.some(([x]) => x === endEdge)) return true;
                }
            }
        } else { // White
            startEdge = 0; // Left
            endEdge = SIZE - 1; // Right
            for (let x = 0; x < SIZE; x++) {
                if (board[x][startEdge] === 1 && !visited.has(`${x},${startEdge}`)) {
                    const chain = getChain(x, startEdge, 1, visited);
                    if (chain.some(([, y]) => y === endEdge)) return true;
                }
            }
        }
        return false;
    }

    function play(x, y) {
        if (gameOver) {
            setMessage("Game is over!");
            return;
        }

        if (swapTargets !== null) {
            // Clicking the already-selected source stone again cancels the
            // pending move. A brief cooloff after selection guards against
            // faulty mice that fire a spurious extra click.
            if (x === lastMoveX && y === lastMoveY) {
                if (Date.now() - pendingSelectedAt < 100) return;
                cancelPendingSwap();
                return;
            }

            // A source stone is already selected; only a highlighted partner
            // cell completes the swap.
            if (swapTargets.some(([tx, ty]) => tx === x && ty === y)) {
                const [sx, sy] = [lastMoveX, lastMoveY];
                const tmp = board[sx][sy];
                board[sx][sy] = board[x][y];
                board[x][y] = tmp;
                clearMessage();
                setLastMoveMarkers(sx, sy, x, y);
                turn = turn === 0 ? 1 : 0;

                const state = saveGameState();
                state.initialX = sx;
                state.initialY = sy;
                state.swapX = x;
                state.swapY = y;
                if (currentMoveIndex < gameHistory.length - 1) {
                    gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
                }
                gameHistory.push(state);
                currentMoveIndex++;
                blackWins = state.blackWins;
                whiteWins = state.whiteWins;
                gameOver = state.gameOver;
                isDraw = state.isDraw;
                swapTargets = null;

                renderBoard();
                updateStatus();
                updateReplayButtons();
                updateLastMoveDisplay();

                if (!gameOver) setTimeout(makeBotReply, 0);
            } else {
                setMessage("Please select a highlighted stone to swap with, or click the first stone again to cancel.");
            }
            return;
        }

        // No swap in progress yet: clicking a stone selects it as the swap
        // source, provided it takes part in at least one legal swap.
        const partners = getLegalPartners(x, y);
        if (partners.length > 0) {
            swapTargets = partners;
            pendingSelectedAt = Date.now();
            setLastMoveMarker(x, y);
            clearMessage();
            renderBoard();
            updateReplayButtons();
        } else {
            setMessage("That stone is not part of any legal swap.");
        }
    }

    function replayStart() {
        currentMoveIndex = 0;
        loadGameState(gameHistory[0]);
        clearMessage();
        updateReplayButtons();
        updateLastMoveDisplay();
    }

    function replayBack() {
        if (currentMoveIndex > 0) {
            currentMoveIndex--;
            loadGameState(gameHistory[currentMoveIndex]);
            clearMessage();
            renderBoard();
            updateStatus();
            updateReplayButtons();
            updateLastMoveDisplay();
        }
    }

    function replayForward() {
        if (currentMoveIndex < gameHistory.length - 1) {
            currentMoveIndex++;
            loadGameState(gameHistory[currentMoveIndex]);
            clearMessage();
            renderBoard();
            updateStatus();
            updateReplayButtons();
            updateLastMoveDisplay();
        }
    }

    function replayEnd() {
        currentMoveIndex = gameHistory.length - 1;
        loadGameState(gameHistory[currentMoveIndex]);
        clearMessage();
        updateReplayButtons();
    }

    function updateReplayButtons() {
        const startBtn = document.querySelector('button[onmousedown="replayStart()"]');
        const backBtn = document.querySelector('button[onmousedown="replayBack()"]');
        const forwardBtn = document.querySelector('button[onmousedown="replayForward()"]');
        const endBtn = document.querySelector('button[onmousedown="replayEnd()"]');
        const randomBtn = document.getElementById('random-button');

        if (isGenerating) {
            startBtn.disabled = true;
            backBtn.disabled = true;
            forwardBtn.disabled = true;
            endBtn.disabled = true;
            randomBtn.disabled = false;
        } else {
            startBtn.disabled = currentMoveIndex === 0;
            backBtn.disabled = currentMoveIndex === 0;
            forwardBtn.disabled = currentMoveIndex === gameHistory.length - 1;
            endBtn.disabled = currentMoveIndex === gameHistory.length - 1;
            randomBtn.disabled = swapTargets !== null;
        }
    }

    function renderBoard() {
        const points = document.getElementsByClassName('point');
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const point = points[i * SIZE + j];
                const stone = point.firstChild;
                stone.className = 'stone';
                if (board[i][j] === 0) {
                    stone.classList.add('black');
                } else if (board[i][j] === 1) {
                    stone.classList.add('white');
                }
                if ((i === lastMoveX && j === lastMoveY) || (i === lastMoveX2 && j === lastMoveY2)) {
                    point.classList.add('last-move');
                } else {
                    point.classList.remove('last-move');
                }
                const existingDot = point.querySelector('.swap-dot');
                if (existingDot) existingDot.remove();
                if (swapTargets && swapTargets.some(([ex, ey]) => ex === i && ey === j)) {
                    const dot = document.createElement('span');
                    dot.className = 'swap-dot';
                    if (board[i][j] === 0) {
                        dot.classList.add('swap-black');
                    } else if (board[i][j] === 1) {
                        dot.classList.add('swap-white');
                    }
                    point.appendChild(dot);
                }
            }
        }
    }

    function updateStatus() {
        const turnStatus = document.getElementById('turn-status');
        let statusText = "";

        if (gameOver) {
            if (isDraw) statusText = 'Draw!';
            else if (blackWins) statusText = blackStoneSVG + ' wins!';
            else statusText = whiteStoneSVG + ' wins!';
        } else {
            statusText = (turn === 0 ? blackStoneSVG : whiteStoneSVG) + ' to move';
        }

        turnStatus.innerHTML = statusText;
        adjustHeaderLayout();
    }

    function getTotalMaxWidth() {
        const controls = document.querySelector('.replay-controls');
        const elements = controls.querySelectorAll('button, select');
        const numElements = elements.length;
        const numGaps = numElements - 1;

        const sampleElement = elements[0];
        const styles = getComputedStyle(sampleElement);
        const maxWidth = parseFloat(styles.maxWidth);
        const paddingLeft = parseFloat(styles.paddingLeft);
        const paddingRight = parseFloat(styles.paddingRight);
        const borderLeft = parseFloat(styles.borderLeftWidth);
        const borderRight = parseFloat(styles.borderRightWidth);
        const gap = parseFloat(getComputedStyle(controls).gap);

        const elementWidth = maxWidth + paddingLeft + paddingRight + borderLeft + borderRight;
        const totalMaxWidth = (elementWidth * numElements) + (gap * numGaps);

        return totalMaxWidth;
    }

    function updateButtonTooltips() {
        const elements = [
            ...document.querySelectorAll('.replay-controls button'),
            ...document.querySelectorAll('.replay-controls select')
        ];
        const wide = window.innerWidth >= getTotalMaxWidth();

        elements.forEach(element => {
            const tooltip = element.dataset.tooltip;
            if (!tooltip) return;
            // Square icon buttons have no visible label at all, so they always
            // need a title; other controls only need one once they'd truncate.
            const isSquareButton = element.classList.contains('sq');
            if (isSquareButton || !wide) {
                element.setAttribute('title', tooltip);
            } else {
                element.removeAttribute('title');
            }
        });
    }

    // Square icon buttons (<<, <, >, >>, dice, robot) size their width to
    // match their own height, since they have no text to size themselves by.
    function fixSquareButtons() {
        document.querySelectorAll('.sq').forEach(btn => {
            btn.style.width = '';
            btn.style.width = btn.offsetHeight + 'px';
        });
    }

    // The Save/Load dropdowns size themselves to fit just their placeholder
    // label ("Save"/"Load") rather than their widest option.
    function fixSaveLoadWidths() {
        for (const [id, label] of [['save-options', 'Save'], ['load-options', 'Load']]) {
            const sel = document.getElementById(id);
            const clone = sel.cloneNode(false);
            const opt = document.createElement('option');
            opt.textContent = label;
            clone.appendChild(opt);
            clone.style.cssText = 'position: absolute; visibility: hidden; width: auto;';
            document.body.appendChild(clone);
            const width = clone.offsetWidth;
            document.body.removeChild(clone);
            sel.style.width = width + 'px';
        }
    }

    function adjustHeaderLayout() {
        const header = document.querySelector('.header');
        const statusLeft = document.querySelector('.status-left');
        const controlsRight = document.querySelector('.controls-right');
        const board = document.querySelector('.board');

        const headerWidth = header.offsetWidth;
        const leftWidth = statusLeft.offsetWidth;
        const rightWidth = controlsRight.offsetWidth;

        statusLeft.style.position = 'absolute';
        controlsRight.style.position = 'absolute';
        statusLeft.style.left = '0';
        controlsRight.style.right = '0';

        // Check if left and right sections overlap
        if (leftWidth + rightWidth > headerWidth) {
            // Push left section further left if needed
            const overflow = leftWidth + rightWidth - headerWidth;
            statusLeft.style.left = `-${overflow / 2}px`;
            controlsRight.style.right = `-${overflow / 2}px`;
        } else {
            statusLeft.style.left = '0';
            controlsRight.style.right = '0';
        }
    }

    // Performs one random legal swap on the live board, committing it to
    // history exactly like a human move would. Shared by the full
    // random-game generator and the single-move bot reply. Returns false
    // (and changes nothing) if no legal swap exists.
    function performRandomSwap() {
        const validMoves = getAllLegalMoves();
        if (validMoves.length === 0) return false;

        const [[sx, sy], [dx, dy]] = validMoves[Math.floor(Math.random() * validMoves.length)];
        const tmp = board[sx][sy];
        board[sx][sy] = board[dx][dy];
        board[dx][dy] = tmp;
        setLastMoveMarkers(sx, sy, dx, dy);

        turn = turn === 0 ? 1 : 0;
        renderBoard();

        const state = saveGameState();
        state.initialX = sx;
        state.initialY = sy;
        state.swapX = dx;
        state.swapY = dy;
        if (currentMoveIndex < gameHistory.length - 1) {
            gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
        }
        gameHistory.push(state);
        currentMoveIndex++;
        blackWins = state.blackWins;
        whiteWins = state.whiteWins;
        gameOver = state.gameOver;
        isDraw = state.isDraw;

        updateStatus();
        updateReplayButtons();
        updateLastMoveDisplay();
        return true;
    }

    const DICE_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="17" r="1.5" fill="currentColor" stroke="none"/></svg>`;
    const STOP_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:block;"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`;
    const BOT_ON_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="1" y="8" width="3" height="5" rx="1"/><rect x="20" y="8" width="3" height="5" rx="1"/><rect x="7" y="7" width="3.5" height="3.5" rx="0.5"/><rect x="13.5" y="7" width="3.5" height="3.5" rx="0.5"/><line x1="8" y1="17" x2="16" y2="17"/></svg>`;
    const BOT_OFF_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="1" y="8" width="3" height="5" rx="1"/><rect x="20" y="8" width="3" height="5" rx="1"/><line x1="7" y1="8.75" x2="10.5" y2="8.75"/><line x1="13.5" y1="8.75" x2="17" y2="8.75"/><line x1="8" y1="17" x2="16" y2="17"/></svg>`;

    function stopGeneration() {
        if (generationInterval) {
            clearInterval(generationInterval);
            generationInterval = null;
            isGenerating = false;
            const randomBtn = document.getElementById('random-button');
            randomBtn.innerHTML = DICE_SVG;
            randomBtn.setAttribute('onmousedown', 'generateRandomGame()');
            randomBtn.title = randomBtn.dataset.tooltip = 'Generate random game';
            updateReplayButtons();
            renderBoard();
        }
    }

    function generateRandomGame() {
        if (isGenerating) {
            stopGeneration();
            return;
        }
        if (gameOver) {
            resetGame(SIZE);
        }

        isGenerating = true;
        const randomBtn = document.getElementById('random-button');
        randomBtn.innerHTML = STOP_SVG;
        randomBtn.setAttribute('onmousedown', 'stopGeneration()');
        randomBtn.title = randomBtn.dataset.tooltip = 'Stop generation';
        updateReplayButtons();

        generationInterval = setInterval(() => {
            if (gameOver || !performRandomSwap()) {
                stopGeneration();
            }
        }, 1);
    }

    // ── Bot reply: after each of your moves, automatically play one random
    // legal swap for the other side, so you can play solo against a random
    // opponent. ──
    function toggleBotReply() {
        botReply = !botReply;
        const btn = document.getElementById('bot-reply-button');
        btn.innerHTML = botReply ? BOT_ON_SVG : BOT_OFF_SVG;
        btn.title = btn.dataset.tooltip = botReply ? 'Bot reply is ON' : 'Bot reply is OFF';
        if (botReply) setTimeout(makeBotReply, 0);
    }

    function makeBotReply() {
        if (!botReply || gameOver || isGenerating) return;
        performRandomSwap();
    }

    function generateGameRecordText() {
        const moveList = [SIZE + 'x' + SIZE];
        for (let i = 1; i < gameHistory.length; i++) {
            const state = gameHistory[i];
            const prevState = gameHistory[i - 1];
            const player = prevState.turn === 0 ? 'B' : 'W';
            if (state.initialX == null) continue;
            const col1 = String.fromCharCode(97 + state.initialY);
            const row1 = SIZE - state.initialX;
            const col2 = String.fromCharCode(97 + state.swapY);
            const row2 = SIZE - state.swapX;
            moveList.push(player + col1 + row1 + '-' + col2 + row2);
        }
        return moveList.join(' ');
    }

    function handleSave() {
        const sel = document.getElementById('save-options');
        const opt = sel.value; if (!opt) return;
        const text = generateGameRecordText();
        if (opt === 'file') {
            const blob = new Blob([text], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'edgecut_game.txt'; a.click();
            URL.revokeObjectURL(url);
        } else if (opt === 'clipboard') {
            navigator.clipboard.writeText(text).then(() => setMessage('Copied to clipboard!'));
        }
        sel.value = '';
    }

    function handleLoad() {
        const sel = document.getElementById('load-options');
        const opt = sel.value;
        if (opt === 'file') document.getElementById('load-input').click();
        else if (opt === 'clipboard') navigator.clipboard.readText().then(text => processGameRecordText(text));
        sel.value = '';
    }

    function processGameRecordText(rawText) {
        const moveText = (rawText || '').trim();
        if (!moveText) { setMessage("Error: Empty game record."); return false; }
        const moves = moveText.split(/\s+/);
        const sizeMatch = moves[0].match(/^(\d+)[-x×*\uFFFD](\d+)$/);
        if (!sizeMatch) { setMessage("Error: Must start with board size (e.g. 13x13)."); return false; }
        const newSize = parseInt(sizeMatch[1]);
        if (sizeMatch[1] !== sizeMatch[2] || newSize < 3 || newSize > 19) {
            setMessage("Error: Invalid board size."); return false;
        }
        resetGame(newSize);
        document.getElementById('board-size').value = newSize;

        let tempTurn = 0;

        for (let i = 1; i < moves.length; i++) {
            const move = moves[i];
            if (!move) continue;

            const moveMatch = move.match(/^([BW])([a-z])(\d+)-([a-z])(\d+)$/);
            if (!moveMatch) { setMessage("Error: Invalid move: " + move); renderBoard(); return false; }
            const [, playerChar, col1, row1, col2, row2] = moveMatch;
            const player = playerChar === 'B' ? 0 : 1;
            if (player !== tempTurn) { setMessage("Error: Move out of turn: " + move); renderBoard(); return false; }

            const sx = newSize - parseInt(row1);
            const sy = col1.charCodeAt(0) - 97;
            const dx = newSize - parseInt(row2);
            const dy = col2.charCodeAt(0) - 97;
            if (sx < 0 || sx >= newSize || sy < 0 || sy >= newSize || dx < 0 || dx >= newSize || dy < 0 || dy >= newSize) {
                setMessage("Error: Move out of bounds: " + move); renderBoard(); return false;
            }
            const legalPartners = getLegalPartners(sx, sy);
            if (!legalPartners.some(([px, py]) => px === dx && py === dy)) {
                setMessage("Error: Illegal swap: " + move); renderBoard(); return false;
            }

            turn = tempTurn;
            const tmp = board[sx][sy];
            board[sx][sy] = board[dx][dy];
            board[dx][dy] = tmp;
            setLastMoveMarkers(sx, sy, dx, dy);

            tempTurn = tempTurn === 0 ? 1 : 0;
            const st = saveGameState();
            st.turn = tempTurn;
            st.initialX = sx; st.initialY = sy;
            st.swapX = dx; st.swapY = dy;
            gameHistory.push(st); currentMoveIndex++;
            blackWins = st.blackWins; whiteWins = st.whiteWins; gameOver = st.gameOver; isDraw = st.isDraw;
        }

        turn = tempTurn;
        renderBoard(); updateStatus(); updateReplayButtons(); updateLastMoveDisplay(); clearMessage();
        return true;
    }

    function loadGame(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => processGameRecordText(e.target.result);
        reader.readAsText(file);
        event.target.value = '';
    }

    function updateLastMoveDisplay() {
        const lastMoveText = document.getElementById('last-move-text');
        const copyButton = document.getElementById('copy-move');

        if (currentMoveIndex <= 0 || gameHistory.length <= 1) {
            lastMoveText.textContent = '';
            copyButton.style.display = 'none';
            return;
        }

        const realState = gameHistory[currentMoveIndex];
        const prevState = gameHistory[currentMoveIndex - 1];
        const player = prevState ? (prevState.turn === 0 ? 'B' : 'W') : 'B';

        if (!realState || realState.initialX == null) {
            lastMoveText.textContent = '';
            copyButton.style.display = 'none';
        } else {
            const col1 = String.fromCharCode(97 + realState.initialY);
            const row1 = SIZE - realState.initialX;
            const col2 = String.fromCharCode(97 + realState.swapY);
            const row2 = SIZE - realState.swapX;
            lastMoveText.textContent = player + col1 + row1 + '-' + col2 + row2;
            copyButton.style.display = 'inline-flex';
        }
    }

    function copyLastMove() {
        const lastMoveText = document.getElementById('last-move-text').textContent;
        if (lastMoveText) {
            navigator.clipboard.writeText(lastMoveText)
                .then(() => {
                    setMessage('Move copied!');
                    setTimeout(() => {
                        if (document.getElementById('message').textContent === 'Move copied!') {
                            clearMessage();
                        }
                    }, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                    setMessage('Failed to copy move!');
                    setTimeout(() => {
                        if (document.getElementById('message').textContent === 'Failed to copy move!') {
                            clearMessage();
                        }
                    }, 2000);
                });
        }
    }

    // === INIT ===

    resetGame(SIZE);
    updateButtonTooltips();
    adjustHeaderLayout();
    fixSquareButtons();
    fixSaveLoadWidths();

    document.getElementById('copy-move').addEventListener('mousedown', copyLastMove);

    const boardSizeSelect = document.getElementById('board-size');
    const saveSelect = document.getElementById('save-options');
    const loadSelect = document.getElementById('load-options');

    [boardSizeSelect, saveSelect, loadSelect].forEach(sel => {
        sel.addEventListener('keydown', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                event.preventDefault();
            }
        });
    });

    window.addEventListener('resize', () => {
        initBoard();
        renderBoard();
        updateButtonTooltips();
        fixSquareButtons();
        fixSaveLoadWidths();
        adjustHeaderLayout();
    });

    window.addEventListener('wheel', (event) => {
        event.preventDefault();
        if (swapTargets !== null) {
            if (event.deltaY < 0) cancelPendingSwap();
            return;
        }
        if (event.deltaY > 0) replayForward();
        else if (event.deltaY < 0) replayBack();
    }, { passive: false });

    document.addEventListener('DOMContentLoaded', updateButtonTooltips);
    document.querySelectorAll('.replay-controls select').forEach(select => {
        select.addEventListener('change', () => {
            updateButtonTooltips();
            if (select.id === 'save-options' || select.id === 'load-options') select.value = '';
            select.blur();
        });
    });

    window.addEventListener('keydown', (event) => {
        const activeElement = document.activeElement;
        const isInputFocused = activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA';

        const keysToPrevent = ['r', 'b', 'i', 'o', 'a', 's', 'x', 'z', 'c', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];

        if (isInputFocused && activeElement.tagName === 'SELECT' && ['ArrowUp', 'ArrowDown', 'Space'].includes(event.key)) {
        } else if (isInputFocused && (event.key.toLowerCase() === 'c' && (event.metaKey || event.ctrlKey))) {
        } else if (keysToPrevent.includes(event.key.toLowerCase())) {
            event.preventDefault();
        } else {
            return;
        }

        const boardSizeSelectEl = document.getElementById('board-size');

        switch (event.key.toLowerCase()) {
            case 'r':
                if (isGenerating) stopGeneration();
                else generateRandomGame();
                break;
            case 'b':
                toggleBotReply();
                break;
            case 'i':
                if (boardSizeSelectEl && document.activeElement !== boardSizeSelectEl) {
                    boardSizeSelectEl.selectedIndex = Math.max(0, boardSizeSelectEl.selectedIndex - 1);
                    boardSizeSelectEl.dispatchEvent(new Event('change'));
                }
                break;
            case 'o':
                if (boardSizeSelectEl && document.activeElement !== boardSizeSelectEl) {
                    boardSizeSelectEl.selectedIndex = Math.min(boardSizeSelectEl.options.length - 1, boardSizeSelectEl.selectedIndex + 1);
                    boardSizeSelectEl.dispatchEvent(new Event('change'));
                }
                break;
            case 'a': {
                const ls = document.getElementById('load-options');
                if (ls) { ls.value = 'file'; ls.dispatchEvent(new Event('change')); }
                break;
            }
            case 's': {
                const ss = document.getElementById('save-options');
                if (ss) { ss.value = 'file'; ss.dispatchEvent(new Event('change')); }
                break;
            }
            case 'z': {
                const ls = document.getElementById('load-options');
                if (ls) { ls.value = 'clipboard'; ls.dispatchEvent(new Event('change')); }
                break;
            }
            case 'x': {
                const ss = document.getElementById('save-options');
                if (ss) { ss.value = 'clipboard'; ss.dispatchEvent(new Event('change')); }
                break;
            }
            case 'c':
                copyLastMove();
                break;
        }

        if (document.activeElement.tagName !== 'SELECT' && !isInputFocused) {
            switch (event.key) {
                case 'ArrowUp': replayStart(); break;
                case 'ArrowDown': replayEnd(); break;
                case 'ArrowLeft': replayBack(); break;
                case 'ArrowRight': replayForward(); break;
            }
        }
    });
</script>
</body>
</html>
