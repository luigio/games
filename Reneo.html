<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reneo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            max-width: 100%;
        }

        .header {
            width: min(100vw, calc(100vh - 100px));
            height: 50px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto;
            overflow: visible;
        }

        .status-left {
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: absolute;
            left: 0;
            z-index: 1;
            padding-right: 0.5em;
        }

        .controls-right {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            white-space: nowrap;
            position: absolute;
            right: 0;
            z-index: 1;
            gap: 0.5em;
        }

        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #f0f0f0;
        }

        .footer {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board {
            width: min(100vw, calc(100vh - 100px));
            height: min(100vw, calc(100vh - 100px));
            background-color: #d9a359;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #last-move-text {
            font-family: Arial, sans-serif;
            font-size: 1.2em;
            white-space: nowrap;
        }

        #copy-move {
            font-size: 1.2em;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-icon {
            width: 1em;
            height: 1em;
            vertical-align: middle;
        }

        #copy-move:hover .copy-icon path {
            fill: #555;
        }

        .grid {
            display: grid;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        .lines {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .point {
            position: relative;
            cursor: pointer;
        }

        .stone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 2;
        }

        .black {
            background: black;
        }

        .white {
            background: white;
            border: 2px solid black;
        }

        .last-move::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22%;
            height: 22%;
            border-radius: 50%;
            background: red;
            z-index: 3;
        }

        .swap-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: 20%;
            border-radius: 50%;
            z-index: 3;
        }

        .swap-dot.swap-black {
            background: white;
        }

        .swap-dot.swap-white {
            background: black;
        }

        .replay-controls {
            display: flex;
            flex-wrap: nowrap;
            width: 100%;
            gap: 0.5em;
            overflow: hidden;
            justify-content: center;
        }

        .replay-controls button,
        .replay-controls select {
            flex: 0 1 auto;
            padding: 0.3em 0.5em;
            font-size: 1em;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            transition: background 0.3s ease;
            min-width: 0;
            text-overflow: clip;
            overflow: hidden;
            white-space: nowrap;
            max-width: 100px;
        }

        button, select {
            font-size: 1em;
            padding: 0.3em 0.5em;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:not(:disabled):hover, select:hover {
            background: #FFF5E9;
        }

        select {
            cursor: pointer;
            text-align: center;
        }

        .replay-controls button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .stone-icon {
            width: 1em;
            height: 1em;
            vertical-align: middle;
            margin-right: 0.5em;
        }

        #message {
            font-family: Arial, sans-serif;
            position: absolute;
            left: calc(50vw + 50vh - 30px);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2em;
            color: #d32f2f;
            width: 20vw;
            text-align: left;
        }

        .left-spacing {
            margin-left: 0.5em;
        }

        #random-button {
            flex: 0 1 auto;
            min-width: 0;
            text-align: center;
            max-width: 8em;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="status-left" id="turn-status"></div>
        <div class="controls-right">
            <div id="last-move-display" style="display: flex; align-items: center; gap: 0.5em;">
                <span id="last-move-text"></span>
                <button id="copy-move" title="Copy last move" style="display: none;">
                    <svg class="copy-icon" viewBox="0 0 24 24">
                        <path fill="black" d="M19 21H8V7h11m0-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-3-4H4a2 2 0 0 0-2 2v14h2V3h12V1z"/>
                    </svg>
                </button>
            </div>
            <button id="hold-button" onmousedown="hold()" style="display: none;">Hold</button>
        </div>
    </div>
    <div class="board-container">
        <div class="board" id="board">
            <div class="lines" id="lines"></div>
            <div class="grid" id="grid"></div>
        </div>
        <div id="message"></div>
    </div>
    <div class="footer">
        <div class="replay-controls">
            <button onmousedown="replayStart()"><<</button>
            <button onmousedown="replayBack()"><</button>
            <button onmousedown="replayForward()">></button>
            <button onmousedown="replayEnd()">>></button>
            <button id="random-button" onmousedown="generateRandomGame()">Random game</button>
            <select id="save-options" onchange="handleSave()">
                <option value="" disabled selected hidden>Save</option>
                <option value="file">To file</option>
                <option value="clipboard">To clipboard</option>
            </select>

            <select id="load-options" onchange="handleLoad()">
                <option value="" disabled selected hidden>Load</option>
                <option value="file">From file</option>
                <option value="clipboard">From clipboard</option>
            </select>
            <select id="board-size" onchange="changeBoardSize()">
                <option value="3">3×3</option>
                <option value="4">4×4</option>
                <option value="5">5×5</option>
                <option value="6">6×6</option>
                <option value="7">7×7</option>
                <option value="8">8×8</option>
                <option value="9">9×9</option>
                <option value="10">10×10</option>
                <option value="11">11×11</option>
                <option value="12">12×12</option>
                <option value="13" selected>13×13</option>
                <option value="14">14×14</option>
                <option value="15">15×15</option>
                <option value="16">16×16</option>
                <option value="17">17×17</option>
                <option value="18">18×18</option>
                <option value="19">19×19</option>
            </select>
            <input type="file" id="load-input" style="display: none;" accept=".txt" onchange="loadGame(event)">
        </div>
    </div>
</div>

<script>
    let SIZE = 13;
    let board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
    let turn = 0; // 0 for Black, 1 for White, convenience variable
    let lastMoveX = null;
    let lastMoveY = null;
    let gameHistory = [];
    let currentMoveIndex = -1;
    let isGenerating = false;
    let generationInterval = null;
    let swapTargets = null;
    let gameOver = false;
    let blackWins = false;
    let whiteWins = false;
    
    const blackStoneSVG = `<svg class="stone-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="black"/></svg>`;
    const whiteStoneSVG = `<svg class="stone-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="white" stroke="black" stroke-width="5"/></svg>`;

    function initBoard() {
        const gridDiv = document.getElementById('grid');
        gridDiv.innerHTML = '';
        const linesDiv = document.getElementById('lines');
        linesDiv.innerHTML = '';
        
        const canvas = document.createElement('canvas');
        const boardSize = document.getElementById('board').offsetWidth;
        canvas.width = boardSize;
        canvas.height = boardSize;
        const ctx = canvas.getContext('2d');
        const cellSize = boardSize / SIZE;
        
        gridDiv.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
        gridDiv.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;

        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const point = document.createElement('div');
                point.className = 'point';
                point.dataset.x = i;
                point.dataset.y = j;
                point.onmousedown = () => play(i, j);
                const stone = document.createElement('div');
                stone.className = 'stone';
                point.appendChild(stone);
                gridDiv.appendChild(point);
            }
        }

        // Draw all thin black grid lines first
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 1;
        for (let i = 0; i < SIZE; i++) {
            const pos = cellSize / 2 + i * cellSize;
            ctx.beginPath();
            ctx.moveTo(pos, cellSize / 2);
            ctx.lineTo(pos, boardSize - cellSize / 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cellSize / 2, pos);
            ctx.lineTo(boardSize - cellSize / 2, pos);
            ctx.stroke();
        }

        // Draw thick edges last (black for top/bottom, white for left/right)
        ctx.lineWidth = 5;
        // Top edge (black)
        ctx.strokeStyle = 'black';
        ctx.beginPath();
        ctx.moveTo(cellSize / 2, cellSize / 2);
        ctx.lineTo(boardSize - cellSize / 2, cellSize / 2);
        ctx.stroke();
        // Bottom edge (black)
        ctx.beginPath();
        ctx.moveTo(cellSize / 2, boardSize - cellSize / 2);
        ctx.lineTo(boardSize - cellSize / 2, boardSize - cellSize / 2);
        ctx.stroke();
        // Left edge (white)
        ctx.strokeStyle = 'white';
        ctx.beginPath();
        ctx.moveTo(cellSize / 2, cellSize / 2);
        ctx.lineTo(cellSize / 2, boardSize - cellSize / 2);
        ctx.stroke();
        // Right edge (white)
        ctx.beginPath();
        ctx.moveTo(boardSize - cellSize / 2, cellSize / 2);
        ctx.lineTo(boardSize - cellSize / 2, boardSize - cellSize / 2);
        ctx.stroke();

        // Miter the four corners: each 5×5 overlap square is split along a 45° diagonal
        // into two filled triangles so the black (horizontal) and white (vertical) edges
        // meet cleanly with no crude overlap.
        {
            const e = ctx.lineWidth / 2; // 2.5px — half the border stroke width
            const h = cellSize / 2;      // center of the corner squares
            const W = boardSize;
            function tri(color, x1,y1, x2,y2, x3,y3) {
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3);
                ctx.closePath(); ctx.fill();
            }
            // Top-left: diagonal from outer (h-e,h-e) to inner (h+e,h+e)
            tri('black', h-e,h-e, h+e,h-e, h+e,h+e);   // upper-right → black (top edge)
            tri('white', h-e,h-e, h-e,h+e, h+e,h+e);   // lower-left  → white (left edge)
            // Top-right: diagonal from outer (W-h+e,h-e) to inner (W-h-e,h+e)
            tri('black', W-h-e,h-e, W-h+e,h-e, W-h-e,h+e);  // upper-left  → black (top edge)
            tri('white', W-h+e,h-e, W-h+e,h+e, W-h-e,h+e);  // lower-right → white (right edge)
            // Bottom-left: diagonal from outer (h-e,W-h+e) to inner (h+e,W-h-e)
            tri('black', h-e,W-h+e, h+e,W-h+e, h+e,W-h-e);  // lower-right → black (bottom edge)
            tri('white', h-e,W-h-e, h+e,W-h-e, h-e,W-h+e);  // upper-left  → white (left edge)
            // Bottom-right: diagonal from outer (W-h+e,W-h+e) to inner (W-h-e,W-h-e)
            tri('black', W-h-e,W-h+e, W-h+e,W-h+e, W-h-e,W-h-e);  // lower-left  → black (bottom edge)
            tri('white', W-h+e,W-h-e, W-h+e,W-h+e, W-h-e,W-h-e);  // upper-right → white (right edge)
        }
        
        linesDiv.appendChild(canvas);
        updateStatus();
        updateLastMoveDisplay();
        updateButtonTooltips();
        adjustHeaderLayout();
    }

    function saveGameState() {
        const bWins = checkWin(0);
        const wWins = checkWin(1);
        return {
            board: board.map(row => [...row]),
            turn: turn,
            lastMoveX: lastMoveX,
            lastMoveY: lastMoveY,
            gameOver: bWins || wWins,
            blackWins: bWins,
            whiteWins: wWins,
            lastWasPieSwap: false
        };
    }

    function loadGameState(state) {
        board = state.board.map(row => [...row]);
        turn = (state.turn !== undefined) ? state.turn : (currentMoveIndex % 2 === 0 ? 0 : 1);
        lastMoveX = state.lastMoveX;
        lastMoveY = state.lastMoveY;
        blackWins = state.blackWins;
        whiteWins = state.whiteWins;
        gameOver = state.gameOver;
        swapTargets = null;
        renderBoard();
        updateStatus();
        updateLastMoveDisplay();
    }

    function resetGame(newSize) {
        SIZE = newSize;
        board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
        turn = 0; // Initial turn is Black
        lastMoveX = null;
        lastMoveY = null;
        gameOver = false;
        blackWins = false;
        whiteWins = false;
        const initialState = saveGameState();
        initialState.turn = 0;
        initialState.initialX = null;
        initialState.initialY = null;
        initialState.swapX = null;
        initialState.swapY = null;
        initialState.isSkip = false;
        gameHistory = [initialState];
        currentMoveIndex = 0;
        swapTargets = null;
        clearMessage();
        initBoard();
        renderBoard();
        updateReplayButtons();
        updateLastMoveDisplay();
    }

    function changeBoardSize() {
        const select = document.getElementById('board-size');
        const newSize = parseInt(select.value);
        resetGame(newSize);
    }

    function clearLastMoveMarker() {
        if (lastMoveX !== null && lastMoveY !== null) {
            const points = document.getElementsByClassName('point');
            const stone = points[lastMoveX * SIZE + lastMoveY].firstChild;
            stone.classList.remove('last-move');
        }
        lastMoveX = null;
        lastMoveY = null;
    }

    function setLastMoveMarker(x, y) {
        clearLastMoveMarker();
        const points = document.getElementsByClassName('point');
        const stone = points[x * SIZE + y].firstChild;
        stone.classList.add('last-move');
        lastMoveX = x;
        lastMoveY = y;
    }

    function setMessage(msg) {
        document.getElementById('message').textContent = msg;
    }

    function clearMessage() {
        document.getElementById('message').textContent = '';
    }

    function isPartOfCrosscut(x, y) {
        for (let i = Math.max(0, x-1); i <= x; i++) {
            for (let j = Math.max(0, y-1); j <= y; j++) {
                if (i >= SIZE - 1 || j >= SIZE - 1) continue;
                const a = board[i][j];
                const b = board[i][j+1];
                const c = board[i+1][j];
                const d = board[i+1][j+1];
                if (a === d && b === c && a !== b && a !== null && b !== null) {
                    return true;
                }
            }
        }
        return false;
    }

    function getCrosscutEnemies(x, y, player) {
        const enemies = [];
        for (let i = Math.max(0, x-1); i <= x; i++) {
            for (let j = Math.max(0, y-1); j <= y; j++) {
                if (i >= SIZE - 1 || j >= SIZE - 1) continue;
                const a = board[i][j];
                const b = board[i][j+1];
                const c = board[i+1][j];
                const d = board[i+1][j+1];
                if (a === d && b === c && a !== b && a !== null && b !== null) {
                    if (a === player) {
                        enemies.push([i, j+1], [i+1, j]);
                    } else if (b === player) {
                        enemies.push([i, j], [i+1, j+1]);
                    }
                }
            }
        }
        return [...new Set(enemies.map(pos => pos.join(',')))].map(pos => pos.split(',').map(Number));
    }

    function getChain(x, y, color, visited = new Set()) {
        if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || visited.has(`${x},${y}`) || board[x][y] !== color) {
            return [];
        }
        visited.add(`${x},${y}`);
        const chain = [[x, y]];
        for (const [dx, dy] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
            chain.push(...getChain(x + dx, y + dy, color, visited));
        }
        return chain;
    }

    function checkWin(color) {
        const visited = new Set();
        let startEdge, endEdge;
        if (color === 0) { // Black
            startEdge = 0; // Top
            endEdge = SIZE - 1; // Bottom
            for (let y = 0; y < SIZE; y++) {
                if (board[startEdge][y] === 0 && !visited.has(`${startEdge},${y}`)) {
                    const chain = getChain(startEdge, y, 0, visited);
                    if (chain.some(([x]) => x === endEdge)) return true;
                }
            }
        } else { // White
            startEdge = 0; // Left
            endEdge = SIZE - 1; // Right
            for (let x = 0; x < SIZE; x++) {
                if (board[x][startEdge] === 1 && !visited.has(`${x},${startEdge}`)) {
                    const chain = getChain(x, startEdge, 1, visited);
                    if (chain.some(([, y]) => y === endEdge)) return true;
                }
            }
        }
        return false;
    }

    function play(x, y) {
        if (gameOver) {
            setMessage("Game is over!");
            return;
        }

        if (swapTargets !== null) {
            const enemy = turn === 0 ? 1 : 0;
            if (board[x][y] === enemy && swapTargets.some(([ex, ey]) => ex === x && ey === y)) {
                const [sx, sy] = [lastMoveX, lastMoveY];
                board[sx][sy] = enemy;
                board[x][y] = turn;
                if (isPartOfCrosscut(sx, sy)) {
                    board[sx][sy] = null;
                }
                clearMessage();
                setLastMoveMarker(x, y);
                turn = turn === 0 ? 1 : 0;
                const state = saveGameState();
                state.initialX = sx;
                state.initialY = sy;
                state.swapX = x;
                state.swapY = y;
                state.isSkip = false;
                state.lastWasPieSwap = false;
                if (currentMoveIndex < gameHistory.length - 1) {
                    gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
                }
                gameHistory.push(state);
                currentMoveIndex++;
                blackWins = state.blackWins;
                whiteWins = state.whiteWins;
                gameOver = state.gameOver;
                swapTargets = null;

                renderBoard();
                updateStatus();

                if (!gameOver && !hasValidMove(turn)) {
                    turn = turn === 0 ? 1 : 0;
                    const skipState = saveGameState();
                    skipState.initialX = null;
                    skipState.initialY = null;
                    skipState.swapX = null;
                    skipState.swapY = null;
                    skipState.isSkip = true;
                    gameHistory.push(skipState);
                    currentMoveIndex++;
                    renderBoard();
                    updateStatus();
                }

                updateReplayButtons();
                updateLastMoveDisplay();
            } else {
                setMessage("Please select a highlighted enemy stone to swap with.");
            }
            return;
        }

        if (board[x][y] !== null) {
            // Pie rule: White clicks Black's first stone to swap sides
            if (canPieSwap() && board[x][y] === 0 && x === lastMoveX && y === lastMoveY) {
                performPieSwap();
            }
            return;
        }

        const oldBoard = board.map(row => [...row]);
        board[x][y] = turn;

        const enemies = getCrosscutEnemies(x, y, turn);
        if (enemies.length > 0) {
            const validTargets = enemies.filter(([ex, ey]) => {
                const temp = board[x][y];
                board[x][y] = board[ex][ey];
                board[ex][ey] = temp;
                const friendlyInCrosscut = isPartOfCrosscut(ex, ey);
                board[ex][ey] = board[x][y];
                board[x][y] = temp;
                return !friendlyInCrosscut;
            });

            if (validTargets.length > 0) {
                swapTargets = validTargets;
                setLastMoveMarker(x, y);
                renderBoard();
                updateReplayButtons();
                //updateLastMoveDisplay();
            } else {
                board = oldBoard;
                setMessage("Placement forms a crosscut with no valid swap.");
            }
        } else {
            clearMessage();
            setLastMoveMarker(x, y);
            turn = turn === 0 ? 1 : 0;
            const state = saveGameState();
            state.initialX = x;
            state.initialY = y;
            state.swapX = null;
            state.swapY = null;
            state.isSkip = false;
            state.lastWasPieSwap = false;
            if (currentMoveIndex < gameHistory.length - 1) {
                gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
            }
            gameHistory.push(state);
            currentMoveIndex++;
            blackWins = state.blackWins;
            whiteWins = state.whiteWins;
            gameOver = state.gameOver;

            renderBoard();
            updateStatus();

            if (!gameOver && !hasValidMove(turn)) {
                turn = turn === 0 ? 1 : 0;
                const skipState = saveGameState();
                skipState.initialX = null;
                skipState.initialY = null;
                skipState.swapX = null;
                skipState.swapY = null;
                skipState.isSkip = true;
                skipState.lastWasPieSwap = false;
                gameHistory.push(skipState);
                currentMoveIndex++;
                renderBoard();
                updateStatus();
            }

            updateReplayButtons();
            updateLastMoveDisplay();
        }
    }

    function replayStart() {
        currentMoveIndex = 0;
        loadGameState(gameHistory[0]);
        clearMessage();
        updateReplayButtons();
        updateLastMoveDisplay();
    }

    function replayBack() {
        if (currentMoveIndex > 0) {
            // Check if the current position is a skip move
            const currentState = gameHistory[currentMoveIndex];
            if (currentState.isSkip) {
                // If current move is a skip, rewind past it and the previous real move
                currentMoveIndex--; // Move past the skip
                if (currentMoveIndex > 0) {
                    currentMoveIndex--; // Move past the real move before it
                }
            } else {
                // If current move is real, just rewind one step
                currentMoveIndex--;
            }
            loadGameState(gameHistory[currentMoveIndex]);
            clearMessage();
            renderBoard();
            updateStatus();
            updateReplayButtons();
            updateLastMoveDisplay();
        }
    }

    function replayForward() {
        if (currentMoveIndex < gameHistory.length - 1) {
            currentMoveIndex++;
            loadGameState(gameHistory[currentMoveIndex]);
            clearMessage();
            renderBoard();
            updateStatus();

            // Check if the next move exists and is a skip move
            if (currentMoveIndex < gameHistory.length - 1 && gameHistory[currentMoveIndex + 1].isSkip) {
                currentMoveIndex++;
                loadGameState(gameHistory[currentMoveIndex]);
                renderBoard();
                updateStatus();
            }

            updateReplayButtons();

            // Handle case where no valid moves remain after the current position
            if (!gameOver && currentMoveIndex === gameHistory.length - 1 && !hasValidMove(turn)) {
                turn = turn === 0 ? 1 : 0;
                const skipState = saveGameState();
                skipState.initialX = null;
                skipState.initialY = null;
                skipState.swapX = null;
                skipState.swapY = null;
                skipState.isSkip = true;
                gameHistory.push(skipState);
                currentMoveIndex++;
                renderBoard();
                updateStatus();
                updateReplayButtons();
            }
            updateLastMoveDisplay();
        }
    }

    function replayEnd() {
        currentMoveIndex = gameHistory.length - 1;
        loadGameState(gameHistory[currentMoveIndex]);
        clearMessage();
        updateReplayButtons();
    }

    function updateReplayButtons() {
        const startBtn = document.querySelector('button[onmousedown="replayStart()"]');
        const backBtn = document.querySelector('button[onmousedown="replayBack()"]');
        const forwardBtn = document.querySelector('button[onmousedown="replayForward()"]');
        const endBtn = document.querySelector('button[onmousedown="replayEnd()"]');
        const randomBtn = document.getElementById('random-button');

        if (isGenerating) {
            startBtn.disabled = true;
            backBtn.disabled = true;
            forwardBtn.disabled = true;
            endBtn.disabled = true;
            randomBtn.disabled = false;
        } else {
            startBtn.disabled = currentMoveIndex === 0;
            backBtn.disabled = currentMoveIndex === 0;
            forwardBtn.disabled = currentMoveIndex === gameHistory.length - 1;
            endBtn.disabled = currentMoveIndex === gameHistory.length - 1;
            randomBtn.disabled = swapTargets !== null;
        }
    }

    function renderBoard() {
        const points = document.getElementsByClassName('point');
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const point = points[i * SIZE + j];
                const stone = point.firstChild;
                stone.className = 'stone';
                if (board[i][j] === 0) {
                    stone.classList.add('black');
                } else if (board[i][j] === 1) {
                    stone.classList.add('white');
                }
                if (i === lastMoveX && j === lastMoveY) {
                    stone.classList.add('last-move');
                }
                const existingDot = point.querySelector('.swap-dot');
                if (existingDot) existingDot.remove();
                if (swapTargets && swapTargets.some(([ex, ey]) => ex === i && ey === j)) {
                    const dot = document.createElement('span');
                    dot.className = 'swap-dot';
                    if (board[i][j] === 0) {
                        dot.classList.add('swap-black');
                    } else if (board[i][j] === 1) {
                        dot.classList.add('swap-white');
                    }
                    point.appendChild(dot);
                }
            }
        }
    }

    function hasValidMove(player) {
        for (let x = 0; x < SIZE; x++) {
            for (let y = 0; y < SIZE; y++) {
                if (board[x][y] !== null) continue;
                const oldBoard = board.map(row => [...row]);
                board[x][y] = player;
                const enemies = getCrosscutEnemies(x, y, player);
                if (enemies.length > 0) {
                    const hasValidSwap = enemies.some(([ex, ey]) => {
                        const temp = board[x][y];
                        board[x][y] = board[ex][ey];
                        board[ex][ey] = temp;
                        const friendlyInCrosscut = isPartOfCrosscut(ex, ey);
                        board[ex][ey] = board[x][y];
                        board[x][y] = temp;
                        return !friendlyInCrosscut;
                    });
                    if (hasValidSwap) {
                        board = oldBoard;
                        return true;
                    }
                } else {
                    board = oldBoard;
                    return true;
                }
                board = oldBoard;
            }
        }
        return false;
    }

    function updateStatus() {
        const turnStatus = document.getElementById('turn-status');
        let statusText = "";

        if (gameOver) {
            statusText = (blackWins ? blackStoneSVG : whiteStoneSVG) + ' wins!';
        } else {
            statusText = (turn === 0 ? blackStoneSVG : whiteStoneSVG) + ' to move';
            //if (canPieSwap()) statusText += ' (or click Black\u2019s stone to swap)';
            if (gameHistory[currentMoveIndex] && gameHistory[currentMoveIndex].isSkip) statusText += ' | Turn skipped';
        }

        turnStatus.innerHTML = statusText;
        adjustHeaderLayout();
    }

    function getTotalMaxWidth() {
        const controls = document.querySelector('.replay-controls');
        const elements = controls.querySelectorAll('button, select');
        const numElements = elements.length;
        const numGaps = numElements - 1;

        const sampleElement = elements[0];
        const styles = getComputedStyle(sampleElement);
        const maxWidth = parseFloat(styles.maxWidth);
        const paddingLeft = parseFloat(styles.paddingLeft);
        const paddingRight = parseFloat(styles.paddingRight);
        const borderLeft = parseFloat(styles.borderLeftWidth);
        const borderRight = parseFloat(styles.borderRightWidth);
        const gap = parseFloat(getComputedStyle(controls).gap);

        const elementWidth = maxWidth + paddingLeft + paddingRight + borderLeft + borderRight;
        const totalMaxWidth = (elementWidth * numElements) + (gap * numGaps);

        return totalMaxWidth;
    }

    function updateButtonTooltips() {
        const buttons = document.querySelectorAll('.replay-controls button');
        const selects = document.querySelectorAll('.replay-controls select');
        const elements = [...buttons, ...selects];
        const totalMaxWidth = getTotalMaxWidth();
        const windowWidth = window.innerWidth;

        elements.forEach(element => {
            let fullText = '';
            if (element.tagName === 'BUTTON') {
                fullText = element.textContent.trim();
            } else if (element.tagName === 'SELECT' && element.selectedIndex >= 0) {
                fullText = element.options[element.selectedIndex].text.trim();
            }

            if (windowWidth < totalMaxWidth) {
                element.setAttribute('title', fullText);
            } else {
                element.removeAttribute('title');
            }
        });
    }

    function adjustHeaderLayout() {
        const header = document.querySelector('.header');
        const statusLeft = document.querySelector('.status-left');
        const controlsRight = document.querySelector('.controls-right');
        const board = document.querySelector('.board');

        const headerWidth = header.offsetWidth;
        const leftWidth = statusLeft.offsetWidth;
        const rightWidth = controlsRight.offsetWidth;

        statusLeft.style.position = 'absolute';
        controlsRight.style.position = 'absolute';
        statusLeft.style.left = '0';
        controlsRight.style.right = '0';

        // Check if left and right sections overlap
        if (leftWidth + rightWidth > headerWidth) {
            // Push left section further left if needed
            const overflow = leftWidth + rightWidth - headerWidth;
            statusLeft.style.left = `-${overflow / 2}px`;
            controlsRight.style.right = `-${overflow / 2}px`;
        } else {
            statusLeft.style.left = '0';
            controlsRight.style.right = '0';
        }
    }

    function stopGeneration() {
        if (generationInterval) {
            clearInterval(generationInterval);
            generationInterval = null;
            isGenerating = false;
            const randomBtn = document.getElementById('random-button');
            randomBtn.style.width = '';
            randomBtn.textContent = 'Random game';
            randomBtn.setAttribute('onmousedown', 'generateRandomGame()');
            updateReplayButtons();
            renderBoard();
        }
    }

    function measureRandomGameWidth() {
        const randomBtn = document.getElementById('random-button');
        const clone = randomBtn.cloneNode(true);
        clone.textContent = 'Random game';
        clone.style.width = '';
        clone.style.visibility = 'hidden';
        clone.style.position = 'absolute';
        clone.removeAttribute('onmousedown');
        document.body.appendChild(clone);
        const width = clone.offsetWidth;
        document.body.removeChild(clone);
        return width;
    }

    function generateRandomGame() {
        if (isGenerating) {
            stopGeneration();
            return;
        }
        if (gameOver) {
            resetGame(SIZE);
        }

        isGenerating = true;
        const randomBtn = document.getElementById('random-button');
        const randomGameWidth = measureRandomGameWidth();
        randomBtn.style.width = `${randomGameWidth}px`;
        randomBtn.textContent = 'Stop';
        randomBtn.setAttribute('onmousedown', 'stopGeneration()');
        updateReplayButtons();

        generationInterval = setInterval(() => {
            if (gameOver) {
                stopGeneration();
                return;
            }

            // Pie rule: randomly decide to swap on White's first move
            if (canPieSwap() && Math.random() < 0.5) {
                performPieSwap();
                return;
            }

            const validMoves = [];
            for (let x = 0; x < SIZE; x++) {
                for (let y = 0; y < SIZE; y++) {
                    if (board[x][y] === null) {
                        const oldBoard = board.map(row => [...row]);
                        board[x][y] = turn;
                        const enemies = getCrosscutEnemies(x, y, turn);
                        let swapOptions = null;
                        if (enemies.length > 0) {
                            swapOptions = enemies.filter(([ex, ey]) => {
                                const temp = board[x][y];
                                board[x][y] = board[ex][ey];
                                board[ex][ey] = temp;
                                const friendlyInCrosscut = isPartOfCrosscut(ex, ey);
                                board[ex][ey] = board[x][y];
                                board[x][y] = temp;
                                return !friendlyInCrosscut;
                            });
                            if (swapOptions.length > 0) {
                                validMoves.push({ x, y, swapTargets: swapOptions });
                            }
                        } else {
                            validMoves.push({ x, y, swapTargets: null });
                        }
                        board = oldBoard;
                    }
                }
            }

            if (validMoves.length === 0) {
                turn = turn === 0 ? 1 : 0;
                const skipState = saveGameState();
                skipState.initialX = null;
                skipState.initialY = null;
                skipState.swapX = null;
                skipState.swapY = null;
                skipState.isSkip = true;
                skipState.lastWasPieSwap = false;
                if (currentMoveIndex < gameHistory.length - 1) {
                    gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
                }
                gameHistory.push(skipState);
                currentMoveIndex++;
                updateStatus();
                updateReplayButtons();
                updateLastMoveDisplay();
                if (!hasValidMove(turn)) {
                    stopGeneration();
                }
                return;
            }

            const move = validMoves[Math.floor(Math.random() * validMoves.length)];
            let initialX = move.x;
            let initialY = move.y;
            let swapX = null;
            let swapY = null;

            board[move.x][move.y] = turn;
            if (move.swapTargets) {
                const [ex, ey] = move.swapTargets[Math.floor(Math.random() * move.swapTargets.length)];
                const enemy = board[ex][ey];
                board[ex][ey] = turn;
                board[move.x][move.y] = enemy;
                if (isPartOfCrosscut(move.x, move.y)) {
                    board[move.x][move.y] = null;
                }
                swapX = ex;
                swapY = ey;
                setLastMoveMarker(ex, ey);
            } else {
                setLastMoveMarker(move.x, move.y);
            }

            turn = turn === 0 ? 1 : 0;
            renderBoard();
            const state = saveGameState();
            state.initialX = initialX;
            state.initialY = initialY;
            state.swapX = swapX;
            state.swapY = swapY;
            state.isSkip = false;
            state.lastWasPieSwap = false;
            if (currentMoveIndex < gameHistory.length - 1) {
                gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
            }
            gameHistory.push(state);
            currentMoveIndex++;
            blackWins = state.blackWins;
            whiteWins = state.whiteWins;
            gameOver = state.gameOver;

            updateStatus();
            updateReplayButtons();
            updateLastMoveDisplay();
        }, 1);
    }

    // ── Pie rule ──
    function canPieSwap() {
        return turn === 1 && currentMoveIndex === 1 && !gameOver && !isGenerating && swapTargets === null;
    }

    function performPieSwap() {
        if (!canPieSwap()) { setMessage("Swap only available as White's first move."); return; }
        if (currentMoveIndex < gameHistory.length - 1) {
            const next = gameHistory[currentMoveIndex + 1];
            if (next.lastWasPieSwap) {
                currentMoveIndex++;
                loadGameState(gameHistory[currentMoveIndex]);
                updateReplayButtons();
                return;
            } else {
                gameHistory = gameHistory.slice(0, currentMoveIndex + 1);
            }
        }
        const state = saveGameState();
        state.turn = 1;
        state.initialX = null; state.initialY = null;
        state.swapX = null; state.swapY = null;
        state.isSkip = false; state.lastWasPieSwap = true;
        gameHistory.push(state);
        currentMoveIndex++;
        renderBoard();
        updateStatus();
        updateLastMoveDisplay();
        updateReplayButtons();
    }

    function generateGameRecordText() {
        const moveList = [SIZE + 'x' + SIZE];
        for (let i = 1; i < gameHistory.length; i++) {
            const state = gameHistory[i];
            const prevState = gameHistory[i - 1];
            const player = prevState.turn === 0 ? 'B' : 'W';
            if (state.lastWasPieSwap) {
                moveList.push('WSwap');
            } else if (state.isSkip) {
                moveList.push(player + '-');
            } else {
                if (state.initialX == null) continue;
                const col = String.fromCharCode(97 + state.initialY);
                const row = SIZE - state.initialX;
                let m = player + col + row;
                if (state.swapX !== null && state.swapY !== null) {
                    const sc = String.fromCharCode(97 + state.swapY);
                    const sr = SIZE - state.swapX;
                    const isCapture = state.board[state.initialX][state.initialY] === null;
                    m += (isCapture ? 'x' : '-') + sc + sr;
                }
                moveList.push(m);
            }
        }
        return moveList.join(' ');
    }

    function handleSave() {
        const sel = document.getElementById('save-options');
        const opt = sel.value; if (!opt) return;
        const text = generateGameRecordText();
        if (opt === 'file') {
            const blob = new Blob([text], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'reneo_game.txt'; a.click();
            URL.revokeObjectURL(url);
        } else if (opt === 'clipboard') {
            navigator.clipboard.writeText(text).then(() => setMessage('Copied to clipboard!'));
        }
        sel.value = '';
    }

    function handleLoad() {
        const sel = document.getElementById('load-options');
        const opt = sel.value;
        if (opt === 'file') document.getElementById('load-input').click();
        else if (opt === 'clipboard') navigator.clipboard.readText().then(text => processGameRecordText(text));
        sel.value = '';
    }

        function processGameRecordText(rawText) {
        const moveText = (rawText || '').trim();
        if (!moveText) { setMessage("Error: Empty game record."); return false; }
        const moves = moveText.split(/\s+/);
        const sizeMatch = moves[0].match(/^(\d+)[-x×*\uFFFD](\d+)$/);
        if (!sizeMatch) { setMessage("Error: Must start with board size (e.g. 13x13)."); return false; }
        const newSize = parseInt(sizeMatch[1]);
        if (sizeMatch[1] !== sizeMatch[2] || newSize < 3 || newSize > 19) {
            setMessage("Error: Invalid board size."); return false;
        }
        resetGame(newSize);
        document.getElementById('board-size').value = newSize;

        let tempTurn = 0;
        let lastMoveWasSkip = false;

        for (let i = 1; i < moves.length; i++) {
            const move = moves[i];
            if (!move) continue;

            if (move.toLowerCase() === 'wswap') {
                if (tempTurn !== 1 || currentMoveIndex !== 1) {
                    setMessage("Error: WSwap only legal as White's first move."); renderBoard(); return false;
                }
                turn = 1;
                const st = saveGameState();
                st.turn = 1; st.initialX = null; st.initialY = null;
                st.swapX = null; st.swapY = null; st.isSkip = false; st.lastWasPieSwap = true;
                gameHistory.push(st); currentMoveIndex++;
                lastMoveWasSkip = false;
                continue;
            }

            const skipMatch = move.match(/^([BW])-$/);
            if (skipMatch) {
                const player = skipMatch[1] === 'B' ? 0 : 1;
                if (player !== tempTurn) { setMessage("Error: Move out of turn: " + move); renderBoard(); return false; }
                turn = tempTurn; tempTurn = tempTurn === 0 ? 1 : 0;
                lastMoveWasSkip = true;
                const ss = saveGameState();
                ss.turn = tempTurn; ss.initialX = null; ss.initialY = null;
                ss.swapX = null; ss.swapY = null; ss.isSkip = true; ss.lastWasPieSwap = false;
                gameHistory.push(ss); currentMoveIndex++;
                blackWins = ss.blackWins; whiteWins = ss.whiteWins; gameOver = ss.gameOver;
                continue;
            }

            const moveMatch = move.match(/^([BW])([a-z])(\d+)(?:([-x])([a-z])(\d+))?$/);
            if (!moveMatch) { setMessage("Error: Invalid move: " + move); renderBoard(); return false; }
            const [, playerChar, col, row, , swapCol, swapRow] = moveMatch;
            const player = playerChar === 'B' ? 0 : 1;
            if (player !== tempTurn) { setMessage("Error: Move out of turn: " + move); renderBoard(); return false; }

            const x = newSize - parseInt(row);
            const y = col.charCodeAt(0) - 97;
            if (x < 0 || x >= newSize || y < 0 || y >= newSize) {
                setMessage("Error: Move out of bounds: " + move); renderBoard(); return false;
            }
            if (board[x][y] !== null) { setMessage("Error: Position occupied: " + move); renderBoard(); return false; }

            turn = tempTurn;
            board[x][y] = tempTurn;
            setLastMoveMarker(x, y);

            let st;
            if (swapCol && swapRow) {
                const sx = newSize - parseInt(swapRow);
                const sy = swapCol.charCodeAt(0) - 97;
                const enemy = tempTurn === 0 ? 1 : 0;
                if (board[sx][sy] !== enemy) { setMessage("Error: Invalid swap in: " + move); renderBoard(); return false; }
                const crossEn = getCrosscutEnemies(x, y, tempTurn);
                if (!crossEn.some(([ex, ey]) => ex === sx && ey === sy)) {
                    setMessage("Error: Swap not crosscut: " + move); renderBoard(); return false;
                }
                board[sx][sy] = tempTurn; board[x][y] = enemy;
                if (isPartOfCrosscut(x, y)) board[x][y] = null;
                setLastMoveMarker(sx, sy);
                tempTurn = tempTurn === 0 ? 1 : 0;
                st = saveGameState();
                st.turn = tempTurn; st.initialX = x; st.initialY = y;
                st.swapX = sx; st.swapY = sy; st.isSkip = false; st.lastWasPieSwap = false;
            } else {
                tempTurn = tempTurn === 0 ? 1 : 0;
                st = saveGameState();
                st.turn = tempTurn; st.initialX = x; st.initialY = y;
                st.swapX = null; st.swapY = null; st.isSkip = false; st.lastWasPieSwap = false;
            }
            gameHistory.push(st); currentMoveIndex++;
            blackWins = st.blackWins; whiteWins = st.whiteWins; gameOver = st.gameOver;
            lastMoveWasSkip = false;
        }

        if (!gameOver && !lastMoveWasSkip && !hasValidMove(tempTurn)) {
            turn = tempTurn === 0 ? 1 : 0;
            const ss = saveGameState();
            ss.turn = tempTurn; ss.initialX = null; ss.initialY = null;
            ss.swapX = null; ss.swapY = null; ss.isSkip = true; ss.lastWasPieSwap = false;
            gameHistory.push(ss); currentMoveIndex++;
        }

        turn = tempTurn;
        renderBoard(); updateStatus(); updateReplayButtons(); updateLastMoveDisplay(); clearMessage();
        return true;
    }

    function loadGame(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => processGameRecordText(e.target.result);
        reader.readAsText(file);
        event.target.value = '';
    }

        function updateLastMoveDisplay() {
        const lastMoveText = document.getElementById('last-move-text');
        const copyButton = document.getElementById('copy-move');

        if (currentMoveIndex <= 0 || gameHistory.length <= 1) {
            lastMoveText.textContent = '';
            copyButton.style.display = 'none';
            return;
        }

        const state = gameHistory[currentMoveIndex];
        if (state.lastWasPieSwap) {
            lastMoveText.textContent = 'WSwap';
            copyButton.style.display = 'inline-flex';
            return;
        }

        // Find the last non-skip, non-pie move
        let idx = currentMoveIndex;
        while (idx > 0 && (gameHistory[idx].isSkip || gameHistory[idx].lastWasPieSwap)) idx--;
        const realState = gameHistory[idx];
        const prevState = gameHistory[idx - 1];
        const player = prevState ? (prevState.turn === 0 ? 'B' : 'W') : 'B';

        if (!realState || realState.isSkip || realState.lastWasPieSwap || realState.initialX == null) {
            lastMoveText.textContent = '';
            copyButton.style.display = 'none';
        } else {
            const col = String.fromCharCode(97 + realState.initialY);
            const row = SIZE - realState.initialX;
            let moveStr = player + col + row;
            if (realState.swapX !== null && realState.swapY !== null) {
                const sc = String.fromCharCode(97 + realState.swapY);
                const sr = SIZE - realState.swapX;
                const isCapture = realState.board[realState.initialX][realState.initialY] === null;
                moveStr += (isCapture ? 'x' : '-') + sc + sr;
            }
            lastMoveText.textContent = moveStr;
            copyButton.style.display = 'inline-flex';
        }
    }

    function copyLastMove() {
        const lastMoveText = document.getElementById('last-move-text').textContent;
        if (lastMoveText) {
            navigator.clipboard.writeText(lastMoveText)
                .then(() => {
                    setMessage('Move copied!');
                    setTimeout(() => {
                        if (document.getElementById('message').textContent === 'Move copied!') {
                            clearMessage();
                        }
                    }, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                    setMessage('Failed to copy move!');
                    setTimeout(() => {
                        if (document.getElementById('message').textContent === 'Failed to copy move!') {
                            clearMessage();
                        }
                    }, 2000);
                });
        }
    }

    // === INIT ===

    resetGame(SIZE);
    updateButtonTooltips();
    adjustHeaderLayout();

    document.getElementById('copy-move').addEventListener('mousedown', copyLastMove);

    const boardSizeSelect = document.getElementById('board-size');
    const saveSelect = document.getElementById('save-options');
    const loadSelect = document.getElementById('load-options');

    [boardSizeSelect, saveSelect, loadSelect].forEach(sel => {
        sel.addEventListener('keydown', (event) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
                event.preventDefault();
            }
        });
    });

    window.addEventListener('resize', () => {
        initBoard();
        renderBoard();
        updateButtonTooltips();
        if (isGenerating) {
            const randomBtn = document.getElementById('random-button');
            const randomGameWidth = measureRandomGameWidth();
            randomBtn.style.width = `${randomGameWidth}px`;
        }
        adjustHeaderLayout();
    });

    window.addEventListener('wheel', (event) => {
        event.preventDefault();
        if (event.deltaY > 0) replayForward();
        else if (event.deltaY < 0) replayBack();
    }, { passive: false });

    document.addEventListener('DOMContentLoaded', updateButtonTooltips);
    document.querySelectorAll('.replay-controls select').forEach(select => {
        select.addEventListener('change', () => {
            updateButtonTooltips();
            if (select.id === 'save-options' || select.id === 'load-options') select.value = '';
            select.blur();
        });
    });

    window.addEventListener('keydown', (event) => {
        const activeElement = document.activeElement;
        const isInputFocused = activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA';

        const keysToPrevent = ['r', 'i', 'o', 'a', 's', 'x', 'z', 'c', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];

        if (isInputFocused && activeElement.tagName === 'SELECT' && ['ArrowUp', 'ArrowDown', 'Space'].includes(event.key)) {
        } else if (isInputFocused && (event.key.toLowerCase() === 'c' && (event.metaKey || event.ctrlKey))) {
        } else if (keysToPrevent.includes(event.key.toLowerCase())) {
            event.preventDefault();
        } else {
            return;
        }

        const boardSizeSelectEl = document.getElementById('board-size');

        switch (event.key.toLowerCase()) {
            case 'r':
                if (isGenerating) stopGeneration();
                else generateRandomGame();
                break;
            case 'i':
                if (boardSizeSelectEl && document.activeElement !== boardSizeSelectEl) {
                    boardSizeSelectEl.selectedIndex = Math.max(0, boardSizeSelectEl.selectedIndex - 1);
                    boardSizeSelectEl.dispatchEvent(new Event('change'));
                }
                break;
            case 'o':
                if (boardSizeSelectEl && document.activeElement !== boardSizeSelectEl) {
                    boardSizeSelectEl.selectedIndex = Math.min(boardSizeSelectEl.options.length - 1, boardSizeSelectEl.selectedIndex + 1);
                    boardSizeSelectEl.dispatchEvent(new Event('change'));
                }
                break;
            case 'a': {
                const ls = document.getElementById('load-options');
                if (ls) { ls.value = 'file'; ls.dispatchEvent(new Event('change')); }
                break;
            }
            case 's': {
                const ss = document.getElementById('save-options');
                if (ss) { ss.value = 'file'; ss.dispatchEvent(new Event('change')); }
                break;
            }
            case 'z': {
                const ls = document.getElementById('load-options');
                if (ls) { ls.value = 'clipboard'; ls.dispatchEvent(new Event('change')); }
                break;
            }
            case 'x': {
                const ss = document.getElementById('save-options');
                if (ss) { ss.value = 'clipboard'; ss.dispatchEvent(new Event('change')); }
                break;
            }
            case 'c':
                copyLastMove();
                break;
        }

        if (document.activeElement.tagName !== 'SELECT' && !isInputFocused) {
            switch (event.key) {
                case 'ArrowUp': replayStart(); break;
                case 'ArrowDown': replayEnd(); break;
                case 'ArrowLeft': replayBack(); break;
                case 'ArrowRight': replayForward(); break;
            }
        }
    });
</script>
</body>
</html>
