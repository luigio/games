<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blobcut</title>
    <style>
        html, body { margin:0;padding:0;height:100vh;width:100vw;overflow:hidden;background-color:#f0f0f0;display:flex;justify-content:center;align-items:center; }
        .game-container { display:flex;flex-direction:column;width:100vw;max-width:100%; }
        .header { width:min(100vw,calc(100vh - 100px));height:50px;position:relative;display:flex;justify-content:space-between;align-items:center;margin:0 auto;overflow:visible; }
        .status-left { font-family:Arial,sans-serif;font-size:1.2em;display:flex;align-items:center;white-space:nowrap;position:absolute;left:0;z-index:1;padding-right:0.5em; }
        .controls-right { font-family:Arial,sans-serif;display:flex;align-items:center;white-space:nowrap;position:absolute;right:0;z-index:1;gap:0.5em; }
        .board-container { display:flex;justify-content:center;align-items:center;width:100%;background-color:#f0f0f0; }
        .footer { width:100%;height:50px;display:flex;justify-content:center;align-items:center; }
        .board { width:min(100vw,calc(100vh - 100px));height:min(100vw,calc(100vh - 100px));background-color:#d9a359;position:relative;display:flex;justify-content:center;align-items:center; }
        #last-move-text { font-family:Arial,sans-serif;font-size:1.2em;white-space:nowrap; }
        #copy-move { font-size:1.2em;padding:0;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center; }
        .copy-icon { width:1em;height:1em;vertical-align:middle; }
        #copy-move:hover .copy-icon path { fill:#555; }
        .grid { display:grid;width:100%;height:100%;position:relative; }
        .lines { position:absolute;width:100%;height:100%;z-index:0; }
        .crosscuts { position:absolute;width:100%;height:100%;z-index:0;pointer-events:none; }
        .merges { position:absolute;width:100%;height:100%;z-index:1;pointer-events:none; }
        .point { position:relative;cursor:pointer; }
        .stone { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;border-radius:50%;box-sizing:border-box; }
        .black { background:black; }
        .white { background:white;border:2px solid black; }
        .point.last-move::after { content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22%;height:22%;border-radius:50%;background:red;z-index:3; }
        .replay-controls { display:flex;flex-wrap:nowrap;width:100%;gap:0.5em;overflow:hidden;justify-content:center; }
        .replay-controls button,.replay-controls select { flex:0 1 auto;padding:0.3em 0.5em;font-size:1em;border:2px solid black;background:white;cursor:pointer;transition:background 0.3s ease;min-width:0;text-overflow:clip;overflow:hidden;white-space:nowrap;max-width:100px; }
        button,select { font-size:1em;padding:0.3em 0.5em;border:2px solid black;background:white;cursor:pointer;transition:background 0.3s ease; }
        button:not(:disabled):hover,select:hover { background:#FFF5E9; }
        select { cursor:pointer;text-align:center; }
        .replay-controls button:disabled { cursor:not-allowed;opacity:0.5; }
        .stone-icon { width:1em;height:1em;vertical-align:middle;margin-right:0.5em; }
        #message { font-family:Arial,sans-serif;position:absolute;left:calc(50vw + 50vh - 30px);top:50%;transform:translateY(-50%);font-size:1.2em;color:#d32f2f;width:20vw;text-align:left; }
        #random-button { flex:0 1 auto;min-width:0; }
        #bot-reply-button { flex:0 1 auto;min-width:0;max-width:8em; }
        .sq { padding:0 !important; display:flex !important; align-items:center; justify-content:center; flex-shrink:0; }
        #save-options, #load-options { flex:0 1 auto;min-width:0;text-align:center; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="status-left" id="turn-status"></div>
        <div class="controls-right">
            <div id="last-move-display" style="display:flex;align-items:center;gap:0.5em;">
                <span id="last-move-text"></span>
                <button id="copy-move" title="Copy last move" style="display:none;">
                    <svg class="copy-icon" viewBox="0 0 24 24"><path fill="black" d="M19 21H8V7h11m0-2H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-3-4H4a2 2 0 0 0-2 2v14h2V3h12V1z"/></svg>
                </button>
            </div>
        </div>
    </div>
    <div class="board-container">
        <div class="board" id="board">
            <div class="lines" id="lines"></div>
            <div class="crosscuts" id="crosscuts"></div>
            <div class="grid" id="grid"></div>
            <div class="merges" id="merges"></div>
        </div>
        <div id="message"></div>
    </div>
    <div class="footer">
        <div class="replay-controls">
            <button class="sq" onmousedown="replayStart()" title="Go to start" data-tooltip="Go to start"><<</button>
            <button class="sq" onmousedown="replayBack()" title="Previous move" data-tooltip="Previous move"><</button>
            <button class="sq" onmousedown="replayForward()" title="Next move" data-tooltip="Next move">></button>
            <button class="sq" onmousedown="replayEnd()" title="Go to end" data-tooltip="Go to end">>></button>
            <button class="sq" id="random-button" onmousedown="generateRandomGame()" title="Generate random game" data-tooltip="Generate random game" data-tooltip-alt="Stop generation"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="17" r="1.5" fill="currentColor" stroke="none"/></svg></button>
            <button class="sq" id="bot-reply-button" onmousedown="toggleBotReply()" title="Bot reply" data-tooltip="Bot reply is OFF" data-tooltip-alt="Bot reply is ON"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="1" y="8" width="3" height="5" rx="1"/><rect x="20" y="8" width="3" height="5" rx="1"/><line x1="7" y1="8.75" x2="10.5" y2="8.75"/><line x1="13.5" y1="8.75" x2="17" y2="8.75"/><line x1="8" y1="17" x2="16" y2="17"/></svg></button>
            <select id="save-options" onchange="handleSave()" data-tooltip="Save game">
                <option value="" disabled selected hidden>Save</option>
                <option value="file">To file</option>
                <option value="clipboard">To clipboard</option>
            </select>
            <select id="load-options" onchange="handleLoad()" data-tooltip="Load game">
                <option value="" disabled selected hidden>Load</option>
                <option value="file">From file</option>
                <option value="clipboard">From clipboard</option>
            </select>
            <select id="board-size" onchange="changeBoardSize()" data-tooltip="Board size">
                <option value="3">3×3</option><option value="5">5×5</option>
                <option value="7">7×7</option><option value="9">9×9</option>
                <option value="11">11×11</option><option value="13" selected>13×13</option>
                <option value="15">15×15</option><option value="17">17×17</option>
                <option value="19">19×19</option>
            </select>
            <input type="file" id="load-input" style="display:none;" accept=".txt" onchange="loadGame(event)">
        </div>
    </div>
</div>

<script>
    let SIZE = parseInt(document.getElementById('board-size').value);
    let board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
    let turn = 0; // 0=Black, 1=White
    let lastMoveX = null, lastMoveY = null;
    let gameHistory = [];
    let currentMoveIndex = -1;
    let isGenerating = false, generationInterval = null;
    let botReply = false;
    let gameOver = false, blackWins = false, whiteWins = false, isDraw = false;

    const blackStoneSVG = `<svg class="stone-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="black"/></svg>`;
    const whiteStoneSVG = `<svg class="stone-icon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="white" stroke="black" stroke-width="5"/></svg>`;

    // ── Board / state management ──

    function initBoard() {
        const gridDiv = document.getElementById('grid');
        gridDiv.innerHTML = '';
        const linesDiv = document.getElementById('lines');
        linesDiv.innerHTML = '';
        document.getElementById('crosscuts').innerHTML = '';
        document.getElementById('merges').innerHTML = '';

        const canvas = document.createElement('canvas');
        const boardSize = document.getElementById('board').offsetWidth;
        canvas.width = boardSize; canvas.height = boardSize;
        const ctx = canvas.getContext('2d');
        const cellSize = boardSize / SIZE;

        gridDiv.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
        gridDiv.style.gridTemplateRows    = `repeat(${SIZE}, 1fr)`;

        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const point = document.createElement('div');
                point.className = 'point';
                point.dataset.x = i; point.dataset.y = j;
                point.onmousedown = () => play(i, j);
                point.appendChild(document.createElement('div')).className = 'stone';
                gridDiv.appendChild(point);
            }
        }

        ctx.strokeStyle = 'black'; ctx.lineWidth = 1;
        for (let i = 0; i < SIZE; i++) {
            const pos = cellSize/2 + i*cellSize;
            ctx.beginPath(); ctx.moveTo(pos, cellSize/2); ctx.lineTo(pos, boardSize-cellSize/2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cellSize/2, pos); ctx.lineTo(boardSize-cellSize/2, pos); ctx.stroke();
        }
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'black';
        ctx.beginPath(); ctx.moveTo(cellSize/2, cellSize/2); ctx.lineTo(boardSize-cellSize/2, cellSize/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cellSize/2, boardSize-cellSize/2); ctx.lineTo(boardSize-cellSize/2, boardSize-cellSize/2); ctx.stroke();
        ctx.strokeStyle = 'white';
        ctx.beginPath(); ctx.moveTo(cellSize/2, cellSize/2); ctx.lineTo(cellSize/2, boardSize-cellSize/2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(boardSize-cellSize/2, cellSize/2); ctx.lineTo(boardSize-cellSize/2, boardSize-cellSize/2); ctx.stroke();

        linesDiv.appendChild(canvas);
        updateStatus(); updateLastMoveDisplay(); updateButtonTooltips(); adjustHeaderLayout();
    }

    function saveGameState() {
        const edges = computeCrosscutEdges();
        const bWins = checkWin(0, edges), wWins = checkWin(1, edges);
        return { board: board.map(r=>[...r]), turn, lastMoveX, lastMoveY,
                 gameOver: bWins||wWins, blackWins: bWins, whiteWins: wWins, lastWasPieSwap: false };
    }

    function loadGameState(state) {
        board = state.board.map(r=>[...r]);
        turn = (state.turn !== undefined) ? state.turn : (currentMoveIndex%2===0 ? 0 : 1);
        lastMoveX = state.lastMoveX; lastMoveY = state.lastMoveY;
        blackWins = state.blackWins; whiteWins = state.whiteWins; gameOver = state.gameOver; isDraw = false;
        resolveSkips();
        renderBoard(); updateStatus(); updateLastMoveDisplay();
    }

    function resetGame(newSize) {
        SIZE = newSize;
        board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
        turn = 0; lastMoveX = null; lastMoveY = null;
        gameOver = false; blackWins = false; whiteWins = false; isDraw = false;
        const init = saveGameState();
        init.turn = 0; init.initialX = null; init.initialY = null; init.isSkip = false;
        gameHistory = [init]; currentMoveIndex = 0;
        clearMessage(); initBoard(); renderBoard(); updateReplayButtons(); updateLastMoveDisplay();
    }

    function changeBoardSize() {
        resetGame(parseInt(document.getElementById('board-size').value));
    }

    function clearLastMoveMarker() {
        if (lastMoveX!==null && lastMoveY!==null)
            document.getElementsByClassName('point')[lastMoveX*SIZE+lastMoveY].classList.remove('last-move');
        lastMoveX = null; lastMoveY = null;
    }

    function setLastMoveMarker(x, y) {
        clearLastMoveMarker();
        document.getElementsByClassName('point')[x*SIZE+y].classList.add('last-move');
        lastMoveX = x; lastMoveY = y;
    }

    function setMessage(msg) { document.getElementById('message').textContent = msg; }
    function clearMessage()  { document.getElementById('message').textContent = ''; }

    function getChain(x, y, color, visited=new Set(), edges=null) {
        if (x<0||x>=SIZE||y<0||y>=SIZE||visited.has(`${x},${y}`)||board[x][y]!==color) return [];
        visited.add(`${x},${y}`);
        const chain = [[x,y]];
        for (const [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]) chain.push(...getChain(x+dx,y+dy,color,visited,edges));
        if (edges) {
            const extra = edges.get(`${x},${y}`);
            if (extra) for (const [nx,ny] of extra) chain.push(...getChain(nx,ny,color,visited,edges));
        }
        return chain;
    }

    function checkWin(color, edges=null) {
        if (!edges) edges = computeCrosscutEdges();
        const visited = new Set();
        if (color===0) { // Black: top row → bottom row
            for (let y=0;y<SIZE;y++)
                if (board[0][y]===0&&!visited.has(`0,${y}`))
                    if (getChain(0,y,0,visited,edges).some(([x])=>x===SIZE-1)) return true;
        } else { // White: left col → right col
            for (let x=0;x<SIZE;x++)
                if (board[x][0]===1&&!visited.has(`${x},0`))
                    if (getChain(x,0,1,visited,edges).some(([,y])=>y===SIZE-1)) return true;
        }
        return false;
    }

    function renderBoard() {
        const points = document.getElementsByClassName('point');
        for (let i=0;i<SIZE;i++) for (let j=0;j<SIZE;j++) {
            const point = points[i*SIZE+j];
            const stone = point.firstChild;
            stone.className = 'stone';
            if (board[i][j]===0) stone.classList.add('black');
            else if (board[i][j]===1) stone.classList.add('white');
            if (i===lastMoveX&&j===lastMoveY) point.classList.add('last-move');
            else point.classList.remove('last-move');
        }
        renderCrosscuts();
    }

    // ── Blobcut rules ──

    // Finds every 2×2 crosscut on the board: a block whose four points are all occupied,
    // with one diagonal pair one color and the other diagonal pair the other color.
    // For each, determines the owner (if any) via the most central 3×3 area that contains
    // the crosscut: a color owns the crosscut once it occupies at least 5 of the 9 points
    // in that 3×3 area.
    //
    // The four points of the crosscut's 2×2 block are themselves the centers of the (up to)
    // four 3×3 areas that contain it — top-left corner centers the top-left-most candidate
    // window, etc. — so "most central" means: among those (board-bounded) candidate windows,
    // the one closest to the true center of the board. Boards are restricted to odd sizes
    // (see board-size select and processGameRecordText), which guarantees this window is
    // always unique — an even-sized board can produce ties between equally central windows
    // with no principled way to break them, which is why even sizes aren't offered.
    function getCrosscuts() {
        const result = [];
        const mid = (SIZE-1)/2; // true center of the board (an integer, since SIZE is always odd)
        for (let r=0;r<SIZE-1;r++) {
            for (let c=0;c<SIZE-1;c++) {
                const a=board[r][c], b=board[r][c+1], d=board[r+1][c], e=board[r+1][c+1];
                if (a===null||b===null||d===null||e===null) continue;
                if (a!==e || b!==d || a===b) continue; // need "\" pair equal, "/" pair equal, and the two pairs differ
                const colorA=a, colorB=b; // colorA = "\" diagonal (r,c)-(r+1,c+1), colorB = "/" diagonal (r,c+1)-(r+1,c)

                const top = (r<mid) ? r : r-1, left = (c<mid) ? c : c-1;
                let black=0, white=0;
                for (let i=top;i<top+3;i++) for (let j=left;j<left+3;j++) {
                    if (board[i][j]===0) black++;
                    else if (board[i][j]===1) white++;
                }
                const owner = black>=5 ? 0 : (white>=5 ? 1 : null);
                result.push({r,c,colorA,colorB,owner});
            }
        }
        return result;
    }

    // Builds the extra adjacency created by owned crosscuts: for each owned crosscut,
    // the two same-colored diagonal stones belonging to the owner become connected.
    function computeCrosscutEdges() {
        const edges = new Map();
        function addEdge(x1,y1,x2,y2) {
            const k1=`${x1},${y1}`, k2=`${x2},${y2}`;
            if (!edges.has(k1)) edges.set(k1, []);
            if (!edges.has(k2)) edges.set(k2, []);
            edges.get(k1).push([x2,y2]);
            edges.get(k2).push([x1,y1]);
        }
        for (const cc of getCrosscuts()) {
            if (cc.owner===null) continue;
            if (cc.owner===cc.colorA) addEdge(cc.r,cc.c,cc.r+1,cc.c+1);
            else addEdge(cc.r,cc.c+1,cc.r+1,cc.c);
        }
        return edges;
    }

    // Fills each owned crosscut with its owner's color. Black stones have no outline, so a
    // black-owned crosscut already merges seamlessly with its stones. For white-owned crosscuts,
    // the two white (owner) stones are masked so their own quadrant facing the crosscut is cut
    // away entirely (fill + outline together, in one paint pass) revealing the white fill square
    // beneath — a true merge with no compositing seam. The two black (non-owner) stones get a
    // matching black arc, of the same thickness as a normal stone outline, drawn on their
    // quadrant facing the crosscut, so their edge stays clearly delineated against the fill.
    const CORNER_MASK_SECTOR = { br:[90,180], tl:[270,360], bl:[180,270], tr:[0,90] };   // conic-gradient angles (0deg = up, clockwise)
    const CORNER_ARC_SECTOR  = { br:[0,90],   tl:[180,270], bl:[90,180],  tr:[270,360] }; // screen angles (0deg = right, clockwise)

    function renderCrosscuts() {
        const div = document.getElementById('crosscuts');
        const mergeDiv = document.getElementById('merges');
        div.innerHTML = '';
        mergeDiv.innerHTML = '';
        const boardEl = document.getElementById('board');
        const boardRect = boardEl.getBoundingClientRect();
        const points = document.getElementsByClassName('point');

        // Point positions are laid out by CSS Grid (repeat(SIZE, 1fr)), which distributes
        // fractional pixel remainders across columns/rows using its own internal rounding.
        // That can drift, column by column, from a naive `boardPx/SIZE * index` JS calculation
        // — the drift compounds with distance from the top-left corner, so a stone can end up
        // rendered a fraction of a pixel away from where such a formula assumes it is. Since the
        // crosscut fill square and arcs need to align exactly with the stones for the mask cut
        // to be fully covered, we read each point's *actual* rendered center via
        // getBoundingClientRect instead of computing it, so there's no drift to align against.
        function centerOf(x, y) {
            const r = points[x*SIZE+y].getBoundingClientRect();
            return { x: r.left - boardRect.left + r.width/2, y: r.top - boardRect.top + r.height/2, r: r.width/2 };
        }

        // Reset any mask left over from a previous render.
        for (let i=0;i<points.length;i++) {
            const stone = points[i].firstChild;
            stone.style.maskImage = 'none';
            stone.style.webkitMaskImage = 'none';
        }

        // A stone can be the "owner corner" of two different crosscuts at once (it sits at the
        // shared corner of two diagonally-adjacent 2x2 blocks), each wanting to cut away a
        // different quadrant. Corners are accumulated per-stone and merged into a single mask
        // at the end, instead of each call overwriting the previous one (which used to leave
        // an earlier-masked quadrant's outline fully visible again).
        const cutCorners = new Map(); // stone index -> Set of corner names
        const QUADRANT_ORDER = ['tr','br','bl','tl']; // fixed 0-90-180-270-360 order, matches CORNER_MASK_SECTOR

        function maskAwayCorner(x, y, corner) {
            const idx = x*SIZE+y;
            if (!cutCorners.has(idx)) cutCorners.set(idx, new Set());
            cutCorners.get(idx).add(corner);
        }

        function applyStoneMasks() {
            for (const [idx, corners] of cutCorners) {
                const stone = points[idx].firstChild;
                let stops = '';
                for (let i=0;i<4;i++) {
                    const q = QUADRANT_ORDER[i];
                    const color = corners.has(q) ? 'transparent' : 'white';
                    stops += `${color} ${i*90}deg ${(i+1)*90}deg, `;
                }
                const g = `conic-gradient(from 0deg, ${stops.slice(0,-2)})`;
                stone.style.maskImage = g;
                stone.style.webkitMaskImage = g;
            }
        }

        const arcs = [];
        function addArc(x, y, corner) {
            const { x: cx, y: cy, r: radius } = centerOf(x, y);
            // Outer edge stays fixed at radius+2 (same visible boundary against the crosscut
            // fill, so the line's on-screen appearance is unchanged). The stroke is widened
            // purely inward, past the stone's true edge and into the stone itself, so the
            // extra width is invisible (black-on-black) but guarantees full coverage across
            // the anti-aliased seam between the independently-rendered stone circle and arc
            // stroke, which could otherwise let a hairline of the fill color show through.
            const outerR = radius + 2;
            const strokeWidth = 4;
            const r = outerR - strokeWidth/2; // centerline
            const [s,e] = CORNER_ARC_SECTOR[corner];
            const sr = s*Math.PI/180, er = e*Math.PI/180;
            const x1 = cx + r*Math.cos(sr), y1 = cy + r*Math.sin(sr);
            const x2 = cx + r*Math.cos(er), y2 = cy + r*Math.sin(er);
            arcs.push(`<path d="M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}" stroke="black" stroke-width="${strokeWidth}" fill="none"/>`);
        }

        // Two passes: white-owned squares first (padded, since white masks need to hide under
        // them), then black-owned squares (exact, unpadded — they never back a mask, so they
        // don't need it). Drawing black-owned squares second means that at any border between
        // a white-owned and a black-owned crosscut, black's crisp true-boundary edge paints on
        // top, cleanly covering white's padding overshoot instead of the two colors competing
        // for that 1-2px strip (which used to leave a stray sliver of one color, or the other,
        // bleeding across the boundary).
        const crosscuts = getCrosscuts().filter(cc => cc.owner!==null);
        function drawSquare(cc, pad) {
            const sq = document.createElement('div');
            sq.style.position = 'absolute';
            const tl = centerOf(cc.r, cc.c), br = centerOf(cc.r+1, cc.c+1);
            sq.style.left = (tl.x - pad) + 'px';
            sq.style.top = (tl.y - pad) + 'px';
            sq.style.width = (br.x - tl.x + pad*2) + 'px';
            sq.style.height = (br.y - tl.y + pad*2) + 'px';
            sq.style.backgroundColor = cc.owner===0 ? 'rgb(0,0,0)' : 'rgb(255,255,255)';
            div.appendChild(sq);
        }

        for (const cc of crosscuts) {
            if (cc.owner!==1) continue;
            // Anchored to the actual rendered centers of the crosscut's top-left and
            // bottom-right stones (not a computed cellSize*index formula), so the fill square's
            // edges always exactly coincide with the real grid lines connecting those points —
            // fully covering the masked-away pie-slice quadrants regardless of any CSS Grid
            // sub-pixel rounding. A small 1px pad guards against ordinary anti-aliasing softness
            // at the mask's hard edge; the overshoot lands under each stone's own opaque,
            // unmasked quadrants, so it's never actually visible.
            drawSquare(cc, 1);

            if (cc.colorA===1) { // "\" diagonal is white: white stones at (r,c) & (r+1,c+1); black stones at (r,c+1) & (r+1,c)
                maskAwayCorner(cc.r, cc.c, 'br');
                maskAwayCorner(cc.r+1, cc.c+1, 'tl');
                addArc(cc.r, cc.c+1, 'bl');
                addArc(cc.r+1, cc.c, 'tr');
            } else { // "/" diagonal is white: white stones at (r,c+1) & (r+1,c); black stones at (r,c) & (r+1,c+1)
                maskAwayCorner(cc.r, cc.c+1, 'bl');
                maskAwayCorner(cc.r+1, cc.c, 'tr');
                addArc(cc.r, cc.c, 'br');
                addArc(cc.r+1, cc.c+1, 'tl');
            }
        }

        for (const cc of crosscuts) {
            if (cc.owner!==0) continue;
            drawSquare(cc, 0); // no mask ever relies on a black-owned square, so no pad needed
        }

        applyStoneMasks();

        if (arcs.length) {
            mergeDiv.innerHTML = `<svg width="${boardRect.width}" height="${boardRect.height}" style="position:absolute;top:0;left:0;">${arcs.join('')}</svg>`;
        }
    }

    // Only odd-sized boards are allowed (see board-size select and processGameRecordText),
    // so every crosscut always has exactly one most-central 3×3 area — no ties are possible,
    // and no placement restriction is needed to avoid one.
    function isValidMove(x, y, color) {
        return board[x][y]===null;
    }

    function hasValidMove() {
        for (let x=0;x<SIZE;x++) for (let y=0;y<SIZE;y++)
            if (isValidMove(x, y, turn)) return true;
        return false;
    }

    // Resolve skips/draw for the current position — updates turn/isDraw/gameOver in memory only,
    // never pushes to history. Called after every state load and after every move.
    function resolveSkips() {
        if (gameOver) return;
        if (hasValidMove()) return;
        turn = turn===0?1:0;
        if (!hasValidMove()) { isDraw = true; gameOver = true; }
    }

    // ── Play ──

    function play(x, y) {
        if (gameOver) { setMessage("Game is over!"); return; }
        if (board[x][y] !== null) return;
        clearMessage();

        board[x][y] = turn;
        setLastMoveMarker(x, y);

        const movingPlayer = turn;
        turn = turn===0?1:0;
        const state = saveGameState();
        state.player=movingPlayer; state.initialX=x; state.initialY=y; state.isSkip=false; state.lastWasPieSwap=false;
        if (currentMoveIndex < gameHistory.length-1)
            gameHistory = gameHistory.slice(0, currentMoveIndex+1);
        gameHistory.push(state); currentMoveIndex++;
        blackWins=state.blackWins; whiteWins=state.whiteWins; gameOver=state.gameOver;
        isDraw=false; resolveSkips();

        renderBoard(); updateStatus();
        updateReplayButtons(); updateLastMoveDisplay();
        if (!gameOver) setTimeout(makeBotReply, 0);
    }

    // ── Replay ──

    function replayStart() {
        currentMoveIndex=0; loadGameState(gameHistory[0]); clearMessage();
        updateReplayButtons(); updateLastMoveDisplay();
    }

    function replayBack() {
        if (currentMoveIndex>0) {
            currentMoveIndex--;
            loadGameState(gameHistory[currentMoveIndex]); clearMessage();
            updateReplayButtons();
        }
    }

    function replayForward() {
        if (currentMoveIndex < gameHistory.length-1) {
            currentMoveIndex++;
            loadGameState(gameHistory[currentMoveIndex]); clearMessage();
            updateReplayButtons();
        }
    }

    function replayEnd() {
        currentMoveIndex=gameHistory.length-1;
        loadGameState(gameHistory[currentMoveIndex]); clearMessage();
        updateReplayButtons();
    }

    function updateReplayButtons() {
        const s=document.querySelector('button[onmousedown="replayStart()"]');
        const b=document.querySelector('button[onmousedown="replayBack()"]');
        const f=document.querySelector('button[onmousedown="replayForward()"]');
        const e=document.querySelector('button[onmousedown="replayEnd()"]');
        const r=document.getElementById('random-button');
        if (isGenerating) { s.disabled=b.disabled=f.disabled=e.disabled=true; r.disabled=false; }
        else {
            s.disabled=b.disabled=(currentMoveIndex===0);
            f.disabled=e.disabled=(currentMoveIndex===gameHistory.length-1);
            r.disabled=false;
        }
    }

    function updateStatus() {
        const el=document.getElementById('turn-status');
        if (gameOver) {
            if (isDraw) el.innerHTML='Draw!';
            else el.innerHTML=(blackWins?blackStoneSVG:whiteStoneSVG)+' wins!';
        }
        else {
            el.innerHTML=(turn===0?blackStoneSVG:whiteStoneSVG)+' to move';
        }
        adjustHeaderLayout();
    }

    // ── Random game ──

    const BOT_ON_SVG  = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="1" y="8" width="3" height="5" rx="1"/><rect x="20" y="8" width="3" height="5" rx="1"/><rect x="7" y="7" width="3.5" height="3.5" rx="0.5"/><rect x="13.5" y="7" width="3.5" height="3.5" rx="0.5"/><line x1="8" y1="17" x2="16" y2="17"/></svg>`;
    const BOT_OFF_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="1" y="8" width="3" height="5" rx="1"/><rect x="20" y="8" width="3" height="5" rx="1"/><line x1="7" y1="8.75" x2="10.5" y2="8.75"/><line x1="13.5" y1="8.75" x2="17" y2="8.75"/><line x1="8" y1="17" x2="16" y2="17"/></svg>`;

    function toggleBotReply() {
        botReply = !botReply;
        const btn = document.getElementById('bot-reply-button');
        btn.innerHTML = botReply ? BOT_ON_SVG : BOT_OFF_SVG;
        btn.title = btn.dataset.tooltip = botReply ? 'Bot reply is ON' : 'Bot reply is OFF';
        if (botReply) setTimeout(makeBotReply, 0);
    }

    function makeBotReply() {
        if (!botReply || gameOver || isGenerating) return;
        const valid = [];
        for (let x=0;x<SIZE;x++) for (let y=0;y<SIZE;y++)
            if (isValidMove(x, y, turn)) valid.push([x, y]);
        if (valid.length === 0) return;
        const [x, y] = valid[Math.floor(Math.random() * valid.length)];
        board[x][y] = turn;
        setLastMoveMarker(x, y);
        const movingPlayer = turn;
        turn = turn===0?1:0;
        const state = saveGameState();
        state.player=movingPlayer; state.initialX=x; state.initialY=y; state.isSkip=false; state.lastWasPieSwap=false;
        if (currentMoveIndex < gameHistory.length-1)
            gameHistory = gameHistory.slice(0, currentMoveIndex+1);
        gameHistory.push(state); currentMoveIndex++;
        blackWins=state.blackWins; whiteWins=state.whiteWins; gameOver=state.gameOver;
        isDraw=false; resolveSkips();
        renderBoard(); updateStatus(); updateReplayButtons(); updateLastMoveDisplay();
    }

    const DICE_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="7" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="1.5" fill="currentColor" stroke="none"/><circle cx="17" cy="17" r="1.5" fill="currentColor" stroke="none"/></svg>`;
    const STOP_SVG = `<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:block;"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`;

    function fixSquareButtons() {
        document.querySelectorAll('.sq').forEach(btn => {
            btn.style.width = '';
            btn.style.width = btn.offsetHeight + 'px';
        });
    }

    function fixSaveLoadWidths() {
        for (const [id, label] of [['save-options', 'Save'], ['load-options', 'Load']]) {
            const sel = document.getElementById(id);
            const clone = sel.cloneNode(false);
            const opt = document.createElement('option');
            opt.textContent = label;
            clone.appendChild(opt);
            clone.style.cssText = 'position:absolute;visibility:hidden;width:auto;';
            document.body.appendChild(clone);
            const w = clone.offsetWidth;
            document.body.removeChild(clone);
            sel.style.width = w + 'px';
        }
    }

    function stopGeneration() {
        if (generationInterval) {
            clearInterval(generationInterval); generationInterval=null; isGenerating=false;
            const r=document.getElementById('random-button');
            r.innerHTML=DICE_SVG; r.setAttribute('onmousedown','generateRandomGame()');
            r.title=r.dataset.tooltip='Generate random game';
            updateReplayButtons(); renderBoard();
        }
    }

    function generateRandomGame() {
        if (isGenerating) { stopGeneration(); return; }
        if (gameOver) resetGame(SIZE);
        isGenerating=true;
        const r=document.getElementById('random-button');
        r.innerHTML=STOP_SVG;
        r.title=r.dataset.tooltip='Stop generation';
        r.setAttribute('onmousedown','stopGeneration()'); updateReplayButtons();

        generationInterval=setInterval(()=>{
            if (gameOver) { stopGeneration(); return; }

            const valid=[];
            for (let x=0;x<SIZE;x++) for (let y=0;y<SIZE;y++)
                if (isValidMove(x, y, turn)) valid.push([x,y]);

            if (valid.length===0) { stopGeneration(); return; } // shouldn't happen; resolveSkips keeps turn correct

            const [x,y]=valid[Math.floor(Math.random()*valid.length)];
            board[x][y]=turn;
            setLastMoveMarker(x,y);
            const movingPlayer=turn;
            turn=turn===0?1:0;
            const st=saveGameState();
            st.player=movingPlayer; st.initialX=x;st.initialY=y;st.isSkip=false;st.lastWasPieSwap=false;
            if (currentMoveIndex<gameHistory.length-1) gameHistory=gameHistory.slice(0,currentMoveIndex+1);
            gameHistory.push(st); currentMoveIndex++;
            blackWins=st.blackWins; whiteWins=st.whiteWins; gameOver=st.gameOver;
            isDraw=false; resolveSkips();
            renderBoard(); updateStatus(); updateReplayButtons(); updateLastMoveDisplay();
            if (gameOver) stopGeneration();
        },1);
    }

    // ── Save / Load ──

    function generateGameRecordText() {
        const moves=[SIZE+'x'+SIZE];
        for (let i=1;i<gameHistory.length;i++) {
            const st=gameHistory[i];
            if (st.initialX!=null) {
                const p=st.player===0?'B':'W';
                const col=String.fromCharCode(97+st.initialY), row=SIZE-st.initialX;
                moves.push(p+col+row);
            }
        }
        return moves.join(' ');
    }

    function handleSave() {
        const sel=document.getElementById('save-options'), opt=sel.value; if (!opt) return;
        const text=generateGameRecordText();
        if (opt==='file') {
            const a=document.createElement('a');
            a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
            a.download='crosswire_game.txt'; a.click();
        } else if (opt==='clipboard') {
            navigator.clipboard.writeText(text).then(()=>setMessage('Copied to clipboard!'));
        }
        sel.value='';
    }

    function handleLoad() {
        const sel=document.getElementById('load-options'), opt=sel.value;
        if (opt==='file') document.getElementById('load-input').click();
        else if (opt==='clipboard') navigator.clipboard.readText().then(t=>processGameRecordText(t));
        sel.value='';
    }

    function loadGame(event) {
        const f=event.target.files[0]; if (!f) return;
        const r=new FileReader();
        r.onload=e=>processGameRecordText(e.target.result);
        r.readAsText(f); event.target.value='';
    }

    function processGameRecordText(rawText) {
        const moveText=(rawText||'').trim();
        if (!moveText) { setMessage("Error: Empty game record."); return false; }
        const moves=moveText.split(/\s+/);
        const sm=moves[0].match(/^(\d+)[-x×*\uFFFD](\d+)$/);
        if (!sm) { setMessage("Error: Must start with board size (e.g. 13x13)."); return false; }
        const ns=parseInt(sm[1]);
        if (sm[1]!==sm[2]||ns<3||ns>19||ns%2===0) { setMessage("Error: Invalid board size (must be odd, 3-19)."); return false; }
        resetGame(ns); document.getElementById('board-size').value=ns;

        let tempTurn=0;
        for (let i=1;i<moves.length;i++) {
            const mv=moves[i]; if (!mv) continue;

            // Accept (ignore) legacy skip notation for backward compatibility
            if (/^[BW]-$/.test(mv)) continue;

            const mm=mv.match(/^([BW])([a-z])(\d+)$/);
            if (!mm) { setMessage("Error: Invalid move: "+mv); renderBoard(); return false; }
            const [,pc,col,row]=mm, pl=pc==='B'?0:1;
            if (pl!==tempTurn) { setMessage("Error: Move out of turn: "+mv); renderBoard(); return false; }
            const x=ns-parseInt(row), y=col.charCodeAt(0)-97;
            if (x<0||x>=ns||y<0||y>=ns) { setMessage("Error: Move out of bounds: "+mv); renderBoard(); return false; }
            if (board[x][y]!==null) { setMessage("Error: Position occupied: "+mv); renderBoard(); return false; }

            board[x][y]=tempTurn;
            setLastMoveMarker(x,y);
            const movingPlayer=tempTurn;
            tempTurn=tempTurn===0?1:0;
            const st=saveGameState(); st.player=movingPlayer; st.turn=tempTurn; st.initialX=x; st.initialY=y; st.isSkip=false; st.lastWasPieSwap=false;
            gameHistory.push(st); currentMoveIndex++;
            blackWins=st.blackWins; whiteWins=st.whiteWins; gameOver=st.gameOver;
            if (gameOver) break;
            // Keep tempTurn in sync with resolveSkips logic (skip detection without touching history)
            turn=tempTurn; isDraw=false;
            if (!hasValidMove()) {
                tempTurn=tempTurn===0?1:0; turn=tempTurn;
                if (!hasValidMove()) { isDraw=true; gameOver=true; break; }
            }
        }

        turn=tempTurn; isDraw=false;
        resolveSkips();
        renderBoard(); updateStatus(); updateReplayButtons(); updateLastMoveDisplay(); clearMessage();
        return true;
    }

    function updateLastMoveDisplay() {
        const txt=document.getElementById('last-move-text'), btn=document.getElementById('copy-move');
        if (currentMoveIndex<=0||gameHistory.length<=1) { txt.textContent=''; btn.style.display='none'; return; }
        const rs=gameHistory[currentMoveIndex];
        if (!rs||rs.initialX==null) { txt.textContent=''; btn.style.display='none'; }
        else {
            const p=rs.player===0?'B':'W';
            txt.textContent=p+String.fromCharCode(97+rs.initialY)+(SIZE-rs.initialX);
            btn.style.display='inline-flex';
        }
    }

    function copyLastMove() {
        const t=document.getElementById('last-move-text').textContent;
        if (t) navigator.clipboard.writeText(t)
            .then(()=>{ setMessage('Move copied!'); setTimeout(()=>{ if (document.getElementById('message').textContent==='Move copied!') clearMessage(); },2000); })
            .catch(()=>{ setMessage('Failed to copy!'); setTimeout(()=>{ if (document.getElementById('message').textContent==='Failed to copy!') clearMessage(); },2000); });
    }

    // ── Layout helpers ──

    function getTotalMaxWidth() {
        const controls=document.querySelector('.replay-controls'), els=controls.querySelectorAll('button,select');
        const s=getComputedStyle(els[0]);
        const ew=parseFloat(s.maxWidth)+parseFloat(s.paddingLeft)+parseFloat(s.paddingRight)+parseFloat(s.borderLeftWidth)+parseFloat(s.borderRightWidth);
        return ew*els.length+parseFloat(getComputedStyle(controls).gap)*(els.length-1);
    }

    function updateButtonTooltips() {
        const els=[...document.querySelectorAll('.replay-controls button'),...document.querySelectorAll('.replay-controls select')];
        const wide=window.innerWidth>=getTotalMaxWidth();
        els.forEach(el=>{
            const tooltip=el.dataset.tooltip;
            if (!tooltip) return;
            const squareButton = el.classList.contains('sq');
            if (squareButton||!wide) el.setAttribute('title',tooltip);
            else el.removeAttribute('title');
        });
    }

    function adjustHeaderLayout() {
        const hdr=document.querySelector('.header'),sl=document.querySelector('.status-left'),cr=document.querySelector('.controls-right');
        sl.style.position=cr.style.position='absolute'; sl.style.left='0'; cr.style.right='0';
        const ov=sl.offsetWidth+cr.offsetWidth-hdr.offsetWidth;
        if (ov>0) { sl.style.left=`-${ov/2}px`; cr.style.right=`-${ov/2}px`; }
    }

    // ── Init ──
    resetGame(SIZE); updateButtonTooltips(); adjustHeaderLayout(); fixSquareButtons(); fixSaveLoadWidths();
    document.getElementById('copy-move').addEventListener('mousedown', copyLastMove);

    [document.getElementById('board-size'),document.getElementById('save-options'),document.getElementById('load-options')].forEach(sel=>{
        sel.addEventListener('keydown',e=>{ if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault(); });
    });

    window.addEventListener('resize',()=>{
        initBoard(); renderBoard(); updateButtonTooltips(); fixSquareButtons(); fixSaveLoadWidths();
        adjustHeaderLayout();
    });

    window.addEventListener('wheel',e=>{ e.preventDefault(); if (e.deltaY>0) replayForward(); else replayBack(); },{passive:false});

    document.addEventListener('DOMContentLoaded', updateButtonTooltips);
    document.querySelectorAll('.replay-controls select').forEach(sel=>{
        sel.addEventListener('change',()=>{ updateButtonTooltips(); if (sel.id==='save-options'||sel.id==='load-options') sel.value=''; sel.blur(); });
    });

    window.addEventListener('keydown',e=>{
        const ae=document.activeElement, inp=ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA';
        const keys=['r','b','i','o','a','s','x','z','c','arrowup','arrowdown','arrowleft','arrowright'];
        if (inp&&ae.tagName==='SELECT'&&['ArrowUp','ArrowDown','Space'].includes(e.key)) {}
        else if (inp&&e.key.toLowerCase()==='c'&&(e.metaKey||e.ctrlKey)) {}
        else if (keys.includes(e.key.toLowerCase())) e.preventDefault();
        else return;
        const bss=document.getElementById('board-size');
        switch(e.key.toLowerCase()) {
            case 'r': isGenerating?stopGeneration():generateRandomGame(); break;
            case 'b': toggleBotReply(); break;
            case 'i': if(bss&&document.activeElement!==bss){bss.selectedIndex=Math.max(0,bss.selectedIndex-1);bss.dispatchEvent(new Event('change'));} break;
            case 'o': if(bss&&document.activeElement!==bss){bss.selectedIndex=Math.min(bss.options.length-1,bss.selectedIndex+1);bss.dispatchEvent(new Event('change'));} break;
            case 'a': {const l=document.getElementById('load-options');if(l){l.value='file';l.dispatchEvent(new Event('change'));}} break;
            case 's': {const s=document.getElementById('save-options');if(s){s.value='file';s.dispatchEvent(new Event('change'));}} break;
            case 'z': {const l=document.getElementById('load-options');if(l){l.value='clipboard';l.dispatchEvent(new Event('change'));}} break;
            case 'x': {const s=document.getElementById('save-options');if(s){s.value='clipboard';s.dispatchEvent(new Event('change'));}} break;
            case 'c': copyLastMove(); break;
        }
        if (ae.tagName!=='SELECT'&&!inp) {
            switch(e.key) {
                case 'ArrowUp': replayStart(); break; case 'ArrowDown': replayEnd(); break;
                case 'ArrowLeft': replayBack(); break; case 'ArrowRight': replayForward(); break;
            }
        }
    });
</script>
</body>
</html>
